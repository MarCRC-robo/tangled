<!doctype html>
<html lang="en">
  <head>
    <title>Marcy let down your hair</title>
    <style>
      body {
        margin: 0;
        padding-top: 60px;
        background-image: url("../images/wall.png");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: #d8bddb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        box-sizing: border-box;
        z-index: 1000;
        /* Set transform origin to left edge for left-to-right expansion */
        transform-origin: left center;
        transition:
          transform 0.6s ease-in-out,
          opacity 0.6s ease-in-out;
      }

      .logo {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .logo img {
        width: 40px; /* Reduced slightly to fit neatly inside 60px bar height */
        height: auto;
        display: block;
      }

      .links {
        display: flex;
        align-items: center;
        margin-left: 20px; /* Adds space between logo and first link */
        margin-right: auto; /* Pushes the language button to the far right */
      }

      .links a {
        color: #eae85d;
        text-decoration: none;
        margin-right: 20px; /* Keeps consistent spacing between links */
        font-family: Arial, sans-serif;
        font-weight: 500;
        white-space: nowrap;
      }

      .links a:hover {
        font-weight: bold;
      }

      /* Language button styling */
      .lang-btn {
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 5px 12px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }

      .sunny img {
        display: flex;
        width: 150px;
        height: auto;
        position: relative;
        transition: all 0.3s ease;
      }

      .sun-1 img {
        top: 100px;
        left: -280px;
      }

      .sun-2 img {
        top: 270px;
        left: -50px;
      }

      .sun-3 img {
        top: 50px;
        left: 120px;
      }

      .sunny img:hover {
        opacity: 1;
        filter: brightness(1.4) drop-shadow(0 0 15px #ffd700)
          drop-shadow(0 0 35px #ffaa00);
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <!-- Place logo first -->
      <a class="logo" href="Home.html">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>

      <!-- Navigation Links -->
      <div class="links">
        <a href="Home.html" data-en="Home" data-fr="Accueil">Home</a>
        <a href="2ndHome.html" data-en="Scenes" data-fr="Scenes">Scenes</a>

        <a href="Robot.html" data-en="Robot" data-fr="Robot">Robot</a>
        <a href="Arcade.html" data-en="Arcade" data-fr="Arcade">Arcade</a>
        <a href="Timeline.html" data-en="Timeline" data-fr="Chronologie"
          >Timeline</a
        >
        <a href="Sponsors.html" data-en="Sponsors" data-fr="Commanditaires"
          >Sponsors</a
        >
        <a href="Team.html" data-en="Team" data-fr="Équipe">Team</a>
      </div>

      <!-- Language Button -->
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>
    </div>

    <div class="sunny sun-1"><img src="../images/sunny.png" alt="sun" /></div>
    <div class="sunny sun-2"><img src="../images/sunny.png" alt="sun" /></div>
    <div class="sunny sun-3"><img src="../images/sunny.png" alt="sun" /></div>

    <script>
      let currentLang = "en";

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";

        // Update button text
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";

        // Update html lang attribute
        document.documentElement.lang = currentLang;

        // Update all elements with data attributes
        const elementsToTranslate = document.querySelectorAll("[data-en]");
        elementsToTranslate.forEach((element) => {
          element.innerText = element.getAttribute(`data-${currentLang}`);
        });
      }
    </script>
  </body>
</html>
