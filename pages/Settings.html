<style>
/* ================= NAVIGATION BAR ================= */

* {
  box-sizing: border-box;
  user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #4c335e, #1a1024);
  font-family: Georgia, serif;
}

body {
  padding-top: 60px;
}

.bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 3px solid #552586;
  background: linear-gradient(
    180deg,
    #b589d6 0%,
    #9969c7 35%,
    #975ed3 50%,
    #6a359c 80%,
    #552586 100%
  );
}

.logo {
  display: flex;
  align-items: center;
  cursor: pointer;
}

.logo img {
  width: 36px;
  height: auto;
  display: block;
}

.desktop-links {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 100%;
  flex: 1;
  margin: 0 12px;
}

.button {
  flex: 1;
  min-width: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 38px;
  padding: 0 8px;
  color: #ffffff;
  text-decoration: none;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(80, 0, 50, 0.6);
  border: 1px solid #552586;
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  background: linear-gradient(
    180deg,
    #6c3299 0%,
    #9969c7 35%,
    #6726ad 50%,
    #3a076a 80%,
    #552586 100%
  );
  transition: filter 0.15s ease;
}

.button:hover {
  filter: brightness(1.15);
}

.button[aria-current="page"] {
  height: 44px;
  margin-bottom: -3px;
  background: linear-gradient(
    180deg,
    #b773ff 0%,
    #913bed 20%,
    #7d2fd1 50%,
    #6726ad 72%,
    #551c92 90%,
    #350d60 100%
  );
}

.dropdown {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: flex-end;
}

.dropdown-content {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 120px;
  background: linear-gradient(180deg, #6a359c 0%, #552586 100%);
  border: 1px solid #552586;
  border-top: none;
  border-radius: 0 0 10px 10px;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  z-index: 1100;
}

.dropdown-content a {
  display: block;
  padding: 14px 20px;
  color: #ffffff;
  text-decoration: none;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  white-space: nowrap;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.dropdown-content a:hover {
  background-color: #3a076a;
  color: #eae85d;
}

.dropdown:hover .dropdown-content {
  display: block;
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.lang-btn {
  background-color: transparent;
  color: #eae85d;
  border: 2px solid #eae85d;
  border-radius: 5px;
  padding: 4px 10px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}

.lang-btn:hover {
  background-color: #eae85d;
  color: #1a0f23;
}

.options {
  display: none;
  background: transparent;
  border: none;
  cursor: pointer;
  flex-direction: column;
  justify-content: space-between;
  width: 26px;
  height: 18px;
  padding: 0;
}

.options span {
  display: block;
  width: 100%;
  height: 3px;
  background-color: #ffffff;
  border-radius: 3px;
}

.mobile-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2000;
  background: linear-gradient(
    180deg,
    #6a359c 0%,
    #552586 40%,
    #350d60 100%
  );
  display: flex;
  flex-direction: column;
  padding: 40px 30px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.mobile-overlay.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.close-btn {
  align-self: flex-start;
  background: none;
  border: none;
  color: #ffffff;
  font-size: 32px;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  margin-bottom: 50px;
}

.mobile-links-list {
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.mobile-link {
  color: #ffffff;
  text-decoration: none;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0.5px;
  transition: color 0.2s ease, transform 0.2s ease;
}

.mobile-link:hover,
.mobile-link[aria-current="page"] {
  color: #eae85d;
  font-weight: bold;
}

.mobile-sublinks {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin: -10px 0 0 20px;
  padding-left: 14px;
  border-left: 2px solid #eae85d;
}

.mobile-sublinks .mobile-link {
  font-size: 17px;
}

/* ================= 3D BOOK CANVAS ================= */

canvas {
  position: fixed;
  top: 60px;
  left: 0;
  display: block;
  width: 100%;
  height: calc(100% - 60px);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  z-index: 1;
}

#hint {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  color: #f3e6ff;
  letter-spacing: .08em;
  font-size: 14px;
  pointer-events: none;
  transition: opacity .6s;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  z-index: 10;
}

#dbg {
  position: fixed;
  left: 8px;
  top: 68px;
  color: #fff;
  font: 12px monospace;
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
  z-index: 10;
}

@media (max-width: 768px) {
  .desktop-links {
    display: none;
  }

  .options {
    display: flex;
  }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

<script>
(() => {
  const W = 1, H = 1.4, SEG = 14, N = 10, GAP = .006, BASE = .004, T = .05, W1 = 1.02, H1 = 1.44;

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

  const smooth = (a, b, x) => {
    x = clamp((x - a) / (b - a));
    return x * x * (3 - 2 * x);
  };

  const coarse = matchMedia('(pointer:coarse)').matches;

  const renderer = new THREE.WebGLRenderer({
    antialias: !coarse,
    powerPreference: 'high-performance'
  });

  let pr = Math.min(devicePixelRatio, coarse ? 1.25 : 1.5);
  let slow = 0;

  renderer.setPixelRatio(pr);
  renderer.outputEncoding = THREE.sRGBEncoding;

  const cv = renderer.domElement;
  document.body.appendChild(cv);

  const hint = document.getElementById('hint');

  addEventListener('error', e => {
    hint.style.opacity = 1;
    hint.textContent = 'Error: ' + e.message;
  });

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, .1, 50);

  /* ---------- Background ---------- */

  {
    const c = document.createElement('canvas');
    c.width = c.height = 128;

    const x = c.getContext('2d');
    const q = x.createRadialGradient(64, 64, 5, 64, 64, 100);

    q.addColorStop(0, '#5a3d70');
    q.addColorStop(1, '#1c1126');

    x.fillStyle = q;
    x.fillRect(0, 0, 128, 128);

    const bt = new THREE.CanvasTexture(c);
    bt.encoding = THREE.sRGBEncoding;
    scene.background = bt;
  }

  /* ---------- Lighting ---------- */

  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x7c5a99, 1.1));

  const sun = new THREE.DirectionalLight(0xfff9e6, 1.1);
  sun.position.set(-2, 4, 3);
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0xe9d5ff, 0.8);
  fill.position.set(3, 2, -2);
  scene.add(fill);

  const book = new THREE.Group();
  scene.add(book);

  function rnd(s) {
    return () => (s = (s * 16807) % 2147483647) / 2147483647;
  }

  /* ---------- Texture Helpers ---------- */

  function tex(draw, w = 512, h = 724) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;

    const g = c.getContext('2d');
    draw(g);

    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.needsUpdate = true;

    t.redraw = () => {
      g.clearRect(0, 0, w, h);
      draw(g);
      t.needsUpdate = true;
    };

    return t;
  }

  function paper(g, spineLeft, num, title, lines) {
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, 512, 724);

    const gr = g.createLinearGradient(
      spineLeft ? 0 : 512,
      0,
      spineLeft ? 90 : 422,
      0
    );

    gr.addColorStop(0, 'rgba(60, 40, 80, .12)');
    gr.addColorStop(1, 'rgba(60, 40, 80, 0)');

    g.fillStyle = gr;
    g.fillRect(0, 0, 512, 724);

    g.fillStyle = '#4c3661';
    g.textAlign = 'center';

    if (title) {
      g.font = 'bold 40px Georgia';
      g.fillText(title, 256, 110);
    }

    const r = rnd((+num || 3) * 31 + 7);

    g.fillStyle = 'rgba(76, 54, 97, .22)';

    for (let i = 0; i < lines; i++) {
      g.fillRect(
        66,
        (title && lines < 5 ? 520 : 170) + i * 30,
        300 + r() * 80,
        7
      );
    }

    g.font = '22px Georgia';
    g.fillStyle = '#4c3661';
    g.fillText(num, 256, 680);
  }

  function endpaper(g) {
    const grad = g.createRadialGradient(256, 362, 40, 256, 362, 480);

    grad.addColorStop(0, '#d7bdf2');
    grad.addColorStop(0.65, '#b68ee0');
    grad.addColorStop(1, '#9467c4');

    g.fillStyle = grad;
    g.fillRect(0, 0, 512, 724);

    const r = rnd(21);

    for (let i = 0; i < 8000; i++) {
      g.fillStyle = r() > 0.5
        ? 'rgba(255,255,255,0.03)'
        : 'rgba(65,30,100,0.035)';

      g.fillRect(r() * 512, r() * 724, 2, 2);
    }
  }

  /* ---------- Cover Artwork ---------- */

  function coverArt(g) {
    const w = 1024, h = 1448, TAU = Math.PI * 2, r = rnd(42);

    const bgGrad = g.createRadialGradient(
      w * 0.48, h * 0.46, 80,
      w / 2, h / 2, 920
    );

    bgGrad.addColorStop(0, '#dfc6f7');
    bgGrad.addColorStop(0.55, '#b98ee3');
    bgGrad.addColorStop(1, '#875ab3');

    g.fillStyle = bgGrad;
    g.fillRect(0, 0, w, h);

    for (let i = 0; i < 42000; i++) {
      const a = r();

      g.fillStyle = a > 0.5
        ? 'rgba(255, 248, 255, 0.035)'
        : 'rgba(60, 25, 95, 0.045)';

      g.fillRect(r() * w, r() * h, 2, 2);
    }

    const goldG = (y0, y1) => {
      const q = g.createLinearGradient(0, y0, 0, y1);
      q.addColorStop(0, '#fff4c2');
      q.addColorStop(0.28, '#e3b84c');
      q.addColorStop(0.65, '#a87a1c');
      q.addColorStop(1, '#634308');
      return q;
    };

    const bronzeG = (y0, y1) => {
      const q = g.createLinearGradient(0, y0, 0, y1);
      q.addColorStop(0, '#c7973e');
      q.addColorStop(0.5, '#7a5214');
      q.addColorStop(1, '#3d2405');
      return q;
    };

    const gold = goldG(0, h);
    const bronze = bronzeG(0, h);

    g.save();

    g.strokeStyle = bronze;
    g.lineWidth = 8;
    g.strokeRect(30, 30, w - 60, h - 60);

    g.strokeStyle = gold;
    g.lineWidth = 4.5;
    g.strokeRect(42, 42, w - 84, h - 84);

    g.strokeStyle = 'rgba(70, 35, 95, 0.45)';
    g.lineWidth = 3;
    g.strokeRect(54, 54, w - 108, h - 108);

    g.strokeStyle = gold;
    g.lineWidth = 3;
    g.strokeRect(64, 64, w - 128, h - 128);

    g.strokeStyle = bronze;
    g.lineWidth = 2;
    g.setLineDash([10, 6]);
    g.strokeRect(76, 76, w - 152, h - 152);
    g.setLineDash([]);

    g.restore();

    function drawBaroqueCorner(cx, cy, sx, sy) {
      g.save();
      g.translate(cx, cy);
      g.scale(sx, sy);

      g.fillStyle = 'rgba(55, 22, 85, 0.35)';
      g.beginPath();
      g.moveTo(8, 8);
      g.lineTo(255, 8);
      g.bezierCurveTo(215, 58, 150, 72, 118, 118);
      g.bezierCurveTo(72, 150, 58, 215, 8, 255);
      g.closePath();
      g.fill();

      g.fillStyle = bronze;
      g.strokeStyle = gold;
      g.lineWidth = 4;

      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(245, 0);
      g.bezierCurveTo(205, 52, 142, 66, 112, 112);
      g.bezierCurveTo(66, 142, 52, 205, 0, 245);
      g.closePath();
      g.fill();
      g.stroke();

      g.strokeStyle = gold;
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(22, 195);
      g.bezierCurveTo(25, 110, 85, 55, 195, 22);
      g.stroke();

      g.beginPath();
      g.moveTo(35, 145);
      g.bezierCurveTo(65, 145, 92, 118, 85, 85);
      g.bezierCurveTo(78, 62, 52, 62, 50, 82);
      g.stroke();

      g.beginPath();
      g.moveTo(145, 35);
      g.bezierCurveTo(145, 65, 118, 92, 85, 85);
      g.stroke();

      g.fillStyle = gold;

      for (let k = 0; k < 6; k++) {
        const ang = (k * Math.PI) / 3;

        g.beginPath();
        g.ellipse(
          42 + Math.cos(ang) * 14,
          42 + Math.sin(ang) * 14,
          11, 6, ang, 0, TAU
        );
        g.fill();
      }

      g.fillStyle = '#4a256b';
      g.beginPath();
      g.arc(42, 42, 7, 0, TAU);
      g.fill();

      g.fillStyle = '#fff5cc';
      g.beginPath();
      g.arc(42, 42, 3.5, 0, TAU);
      g.fill();

      g.fillStyle = gold;
      g.beginPath();
      g.arc(218, 18, 7, 0, TAU);
      g.arc(18, 218, 7, 0, TAU);
      g.arc(124, 124, 8, 0, TAU);
      g.fill();

      g.restore();
    }

    drawBaroqueCorner(64, 64, 1, 1);
    drawBaroqueCorner(w - 64, 64, -1, 1);
    drawBaroqueCorner(64, h - 64, 1, -1);
    drawBaroqueCorner(w - 64, h - 64, -1, -1);

    function drawSideOrnament(xPos, dir) {
      g.save();
      g.translate(xPos, h / 2);
      g.scale(dir, 1);

      g.strokeStyle = gold;
      g.fillStyle = bronze;
      g.lineWidth = 3.5;

      g.beginPath();
      g.moveTo(0, -34);
      g.quadraticCurveTo(24, 0, 0, 34);
      g.quadraticCurveTo(-14, 0, 0, -34);
      g.fill();
      g.stroke();

      g.fillStyle = gold;
      g.beginPath();
      g.arc(6, 0, 6, 0, TAU);
      g.fill();

      [-1, 1].forEach(vy => {
        g.save();
        g.scale(1, vy);

        g.beginPath();
        g.moveTo(0, 34);
        g.bezierCurveTo(32, 65, 36, 125, 6, 165);
        g.bezierCurveTo(-10, 185, 16, 205, 22, 185);
        g.stroke();

        g.beginPath();
        g.ellipse(22, 98, 12, 5, 0.5, 0, TAU);
        g.fill();

        g.beginPath();
        g.arc(12, 225, 5, 0, TAU);
        g.fill();

        g.restore();
      });

      g.restore();
    }

    drawSideOrnament(64, 1);
    drawSideOrnament(w - 64, -1);

    function drawHorizontalCrest(yPos, dir) {
      g.save();
      g.translate(w / 2, yPos);
      g.scale(1, dir);

      g.strokeStyle = gold;
      g.fillStyle = bronze;
      g.lineWidth = 4;

      g.beginPath();
      g.moveTo(0, 8);
      g.bezierCurveTo(-34, 24, -44, 68, 0, 92);
      g.bezierCurveTo(44, 68, 34, 24, 0, 8);
      g.fill();
      g.stroke();

      [-1, 1].forEach(hx => {
        g.save();
        g.scale(hx, 1);

        g.beginPath();
        g.moveTo(22, 26);
        g.bezierCurveTo(75, 10, 130, 58, 185, 42);
        g.bezierCurveTo(220, 32, 232, 8, 205, 6);
        g.stroke();

        g.beginPath();
        g.moveTo(32, 48);
        g.bezierCurveTo(78, 72, 125, 68, 152, 48);
        g.stroke();

        g.fillStyle = gold;
        g.beginPath();
        g.ellipse(84, 34, 18, 7, -0.3, 0, TAU);
        g.fill();

        g.beginPath();
        g.ellipse(142, 46, 15, 6, 0.25, 0, TAU);
        g.fill();

        g.beginPath();
        g.arc(248, 22, 6, 0, TAU);
        g.fill();

        g.restore();
      });

      g.fillStyle = '#fff5cc';
      g.beginPath();
      g.arc(0, 48, 7, 0, TAU);
      g.fill();

      g.restore();
    }

    drawHorizontalCrest(64, 1);
    drawHorizontalCrest(h - 64, -1);

    g.save();

    g.textAlign = 'center';
    g.textBaseline = 'middle';

    const title = 'Manuel';
    const fontSize = 192;

    g.font = `700 ${fontSize}px "Berkshire Swash", "Almendra", Georgia, serif`;

    const metrics = g.measureText(title);
    const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.68;
    const descent = metrics.actualBoundingBoxDescent || fontSize * 0.24;

    const cx = w / 2;
    const cy = h / 2 + (ascent - descent) * 0.5;

    g.lineJoin = 'round';
    g.lineCap = 'round';

    g.shadowColor = 'rgba(42, 14, 68, 0.65)';
    g.shadowBlur = 22;
    g.shadowOffsetX = 0;
    g.shadowOffsetY = 12;

    g.lineWidth = 18;
    g.strokeStyle = '#3d2206';
    g.strokeText(title, cx, cy + 5);

    g.shadowColor = 'transparent';
    g.lineWidth = 12;
    g.strokeStyle = '#73490e';
    g.strokeText(title, cx, cy + 2);

    const textGrad = g.createLinearGradient(0, cy - ascent, 0, cy + descent);

    textGrad.addColorStop(0.0, '#fffbe0');
    textGrad.addColorStop(0.28, '#f5d26b');
    textGrad.addColorStop(0.55, '#c99324');
    textGrad.addColorStop(0.82, '#996810');
    textGrad.addColorStop(1.0, '#e8be54');

    g.fillStyle = textGrad;
    g.fillText(title, cx, cy);

    g.lineWidth = 3;
    g.strokeStyle = 'rgba(255, 250, 215, 0.85)';
    g.strokeText(title, cx, cy - 1);

    g.restore();
  }

  /* ---------- Hardcover & Book Construction ---------- */

  const purpleCoverMat = new THREE.MeshStandardMaterial({
    color: 0xa578d1,
    roughness: 0.55,
    metalness: 0.08
  });

  const coverTex = tex(coverArt, 1024, 1448);
  const endTex = tex(endpaper);
  const endFlip = tex(endpaper);

  endFlip.repeat.set(-1, -1);
  endFlip.offset.set(1, 1);

  const mat = m => new THREE.MeshBasicMaterial(m);

  const cp = new THREE.Group();

  const front = new THREE.Mesh(
    new THREE.BoxGeometry(W1, T, H1),
    [
      purpleCoverMat,
      purpleCoverMat,
      mat({ map: coverTex }),
      mat({ map: endFlip }),
      purpleCoverMat,
      purpleCoverMat
    ]
  );

  front.position.set(W1 / 2, T / 2, 0);
  cp.add(front);
  book.add(cp);

  const back = new THREE.Mesh(
    new THREE.BoxGeometry(W1, T, H1),
    [
      purpleCoverMat,
      purpleCoverMat,
      mat({ map: endTex }),
      purpleCoverMat,
      purpleCoverMat,
      purpleCoverMat
    ]
  );

  back.position.set(W1 / 2, -T / 2, 0);
  book.add(back);

  const strip = new THREE.Mesh(
    new THREE.BoxGeometry(.02, T, H1),
    purpleCoverMat
  );

  strip.position.set(0, -T / 2, 0);
  book.add(strip);

  const spine = new THREE.Mesh(
    new THREE.BoxGeometry(.025, 1, H1),
    purpleCoverMat
  );

  book.add(spine);

  const blockMat = new THREE.MeshBasicMaterial({ color: 0xfbf8ff });

  const rBlock = new THREE.Mesh(
    new THREE.BoxGeometry(W, 1, H),
    blockMat
  );

  const lBlock = new THREE.Mesh(
    new THREE.BoxGeometry(W, 1, H),
    blockMat
  );

  rBlock.position.x = W / 2;
  lBlock.position.x = -W / 2;

  book.add(rBlock, lBlock);

  /* ---------- Paper Sheets ---------- */

  function makeLeaf(i, frontTex, backTex) {
    const geo = new THREE.BufferGeometry();
    const n = (SEG + 1) * 2;
    const uv = new Float32Array(n * 2);
    const idx = [];

    geo.setAttribute(
      'position',
      new THREE.BufferAttribute(new Float32Array(n * 3), 3)
    );

    for (let k = 0; k <= SEG; k++) {
      uv.set([k / SEG, 1, k / SEG, 0], k * 4);

      if (k < SEG) {
        const a = k * 2;
        const b = a + 1;
        const c = a + 2;
        const d = a + 3;

        idx.push(a, b, c, b, d, c);
      }
    }

    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(idx);

    const matF = new THREE.MeshBasicMaterial({
      map: frontTex,
      polygonOffset: true,
      polygonOffsetFactor: -2 - i,
      polygonOffsetUnits: -2 - i
    });

    const matB = new THREE.MeshBasicMaterial({
      map: backTex,
      side: THREE.BackSide,
      polygonOffset: true,
      polygonOffsetFactor: -2 - i,
      polygonOffsetUnits: -2 - i
    });

    const mf = new THREE.Mesh(geo, matF);
    const mb = new THREE.Mesh(geo, matB);

    mf.frustumCulled = mb.frustumCulled = false;

    book.add(mf, mb);

    return {
      i,
      w: W,
      h: H,
      geo,
      mf,
      mb,
      bend: .65,
      t: 0,
      target: 0,
      drag: false,
      _t: -1
    };
  }

  const L = [{ t: 0, target: 0, drag: false }];

  for (let i = 1; i < N; i++) {
    const tF = tex(g =>
      paper(
        g,
        true,
        String(2 * i - 1),
        i === 1 ? 'Manuel' : 'Chapter ' + i,
        i === 1 ? 3 : 14
      )
    );

    const tB = tex(g =>
      paper(g, false, String(2 * i), null, 15)
    );

    tB.repeat.x = -1;
    tB.offset.x = 1;

    L.push(makeLeaf(i, tF, tB));
  }

  function update(l) {
    const th = Math.PI * l.t;
    const B = l.bend * Math.sin(th);
    const p = l.geo.attributes.position;

    for (let k = 0; k <= SEG; k++) {
      const s = k / SEG;
      let x, y;

      if (B < 1e-4) {
        x = l.w * s * Math.cos(th);
        y = l.w * s * Math.sin(th);
      } else {
        const R = l.w / Math.max(1e-4, B);

        x = R * (Math.sin(th) - Math.sin(th - B * s));
        y = R * (Math.cos(th - B * s) - Math.cos(th));
      }

      p.setXYZ(k * 2, x, y, -l.h / 2);
      p.setXYZ(k * 2 + 1, x, y, l.h / 2);
    }

    p.needsUpdate = true;
  }

  /* ---------- Soft Ground Shadow ---------- */

  const sc = document.createElement('canvas');
  sc.width = sc.height = 128;

  const sg = sc.getContext('2d');
  const sr = sg.createRadialGradient(64, 64, 10, 64, 64, 64);

  sr.addColorStop(0, 'rgba(20, 8, 36, .68)');
  sr.addColorStop(1, 'rgba(20, 8, 36, 0)');

  sg.fillStyle = sr;
  sg.fillRect(0, 0, 128, 128);

  const blob = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(sc),
      transparent: true,
      depthWrite: false
    })
  );

  blob.rotation.x = -Math.PI / 2;
  blob.position.y = -T - .01;
  scene.add(blob);

  /* ---------- 3D Pop-up Model ---------- */

  const pivot = new THREE.Group();

  let fit = 1;
  let modelLoaded = false;

  pivot.visible = false;
  book.add(pivot);

  const gltfLoader = new THREE.GLTFLoader();

  function cheapMat(m, useMap, useVC) {
    const dark = m.color &&
      m.color.r + m.color.g + m.color.b === 0;

    return new THREE.MeshLambertMaterial({
      color: (!m.color || dark)
        ? new THREE.Color(0xd8b4fe)
        : m.color.clone(),
      map: useMap ? m.map : null,
      vertexColors: useVC,
      side: THREE.DoubleSide
    });
  }

  function optimizeModel(model) {
    model.updateMatrixWorld(true);

    const inv = new THREE.Matrix4()
      .copy(model.matrixWorld)
      .invert();

    const buckets = new Map();

    let meshes = 0;
    let tris = 0;
    let calls = 0;

    model.traverse(o => {
      if (!o.isMesh || !o.geometry) return;

      meshes++;

      const pos = o.geometry.attributes.position;

      tris += (
        o.geometry.index
          ? o.geometry.index.count
          : pos.count
      ) / 3;

      o.frustumCulled = false;

      if (Array.isArray(o.material)) {
        o.material = o.material.map(m =>
          cheapMat(
            m,
            !!m.map && !!o.geometry.attributes.uv,
            !!m.vertexColors && !!o.geometry.attributes.color
          )
        );

        o.geometry.computeVertexNormals();
        calls++;
        return;
      }

      const m = o.material;
      const g = o.geometry.clone();

      g.morphAttributes = {};

      const useMap = !!m.map && !!g.attributes.uv;
      const useVC = !!m.vertexColors && !!g.attributes.color;

      Object.keys(g.attributes).forEach(k => {
        if (
          k === 'position' ||
          k === 'normal' ||
          (k === 'uv' && useMap) ||
          (k === 'color' && useVC)
        ) return;

        g.deleteAttribute(k);
      });

      g.computeVertexNormals();

      g.applyMatrix4(
        new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld)
      );

      const key = [
        m.color ? m.color.getHexString() : 'x',
        useMap ? m.map.uuid : '',
        useVC ? g.attributes.color.itemSize : 0
      ].join('|');

      if (!buckets.has(key)) {
        buckets.set(key, {
          m,
          useMap,
          useVC,
          list: [],
          olds: []
        });
      }

      const bk = buckets.get(key);

      bk.list.push(g);
      bk.olds.push(o);
    });

    const merged = [];

    buckets.forEach(bk => {
      let list = bk.list;

      if (!list.every(x => !!x.index === !!list[0].index)) {
        list = list.map(x => x.index ? x.toNonIndexed() : x);
      }

      const geo = list.length === 1
        ? list[0]
        : THREE.BufferGeometryUtils.mergeBufferGeometries(list, false);

      if (!geo) {
        bk.olds.forEach(o => {
          o.material = cheapMat(bk.m, bk.useMap, bk.useVC);
          o.geometry.computeVertexNormals();
          calls++;
        });

        return;
      }

      const mesh = new THREE.Mesh(
        geo,
        cheapMat(bk.m, bk.useMap, bk.useVC)
      );

      mesh.frustumCulled = false;
      merged.push(mesh);

      bk.olds.forEach(o => {
        if (o.parent) o.parent.remove(o);
        o.geometry.dispose();
      });

      calls++;
    });

    merged.forEach(mm => model.add(mm));

    return {
      meshes,
      calls,
      tris: Math.round(tris)
    };
  }

  let dbgInfo = '';

  function setupLoadedModel(gltf) {
    const model = gltf.scene;
    const info = optimizeModel(model);

    dbgInfo = info.meshes +
      ' meshes -> ' +
      info.calls +
      ' draw calls, ' +
      info.tris +
      ' tris';

    console.log('Model:', dbgInfo);

    model.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const c = box.getCenter(new THREE.Vector3());

    model.position.set(-c.x, -box.min.y, -c.z);
    pivot.add(model);

    const maxDim = Math.max(size.x, size.y, size.z);

    fit = (maxDim > 0 && isFinite(maxDim))
      ? (0.85 / maxDim)
      : 1;

    modelLoaded = true;

    warm();
    needs = true;
  }

  gltfLoader.load(
    '../models/model.glb',
    setupLoadedModel,
    undefined,
    () => {
      hint.style.opacity = 1;
      hint.textContent = 'Could not load model.glb';
    }
  );

  function warm() {
    scene.traverse(o => {
      [].concat(o.material || []).forEach(m => {
        if (m && m.map) {
          m.map.needsUpdate = true;
          renderer.initTexture(m.map);
        }
      });
    });

    const v = pivot.visible;
    pivot.visible = true;

    renderer.compile(scene, camera);

    pivot.visible = v;
  }

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('700 100px "Berkshire Swash"'),
      document.fonts.load('italic 700 100px "Almendra"')
    ]).then(() => {
      coverTex.redraw();
      needs = true;
    }).catch(() => {});
  }

  /* ---------- Interaction ---------- */

  const ray = new THREE.Raycaster();

  const plane = new THREE.Plane(
    new THREE.Vector3(0, 1, 0),
    -.05
  );

  const pt = new THREE.Vector3();
  const v2 = new THREE.Vector2();

  const par = { x: 0, y: 0 };
  const cur = { x: 0, y: 0 };

  function lx(e) {
    const canvasY = e.clientY - 60;
    const canvasH = innerHeight - 60;

    v2.set(
      e.clientX / innerWidth * 2 - 1,
      -(canvasY / canvasH) * 2 + 1
    );

    ray.setFromCamera(v2, camera);
    ray.ray.intersectPlane(plane, pt);

    return pt.x;
  }

  let drag = null;

  cv.addEventListener('pointerdown', e => {
    const x = lx(e);

    const turned = L.filter(l => l.target === 1).length;

    let leaf = null;
    let dir = 0;

    if (x > 0 && turned < N) {
      leaf = L[turned];
      dir = 1;
    } else if (x < 0 && turned > 0) {
      leaf = L[turned - 1];
      dir = -1;
    }

    if (!leaf) return;

    drag = {
      leaf,
      dir,
      x0: x,
      t0: leaf.t,
      px: e.clientX,
      py: e.clientY,
      time: performance.now(),
      dx: 0,
      last: e.clientX,
      moved: 0
    };

    leaf.drag = true;

    cv.setPointerCapture(e.pointerId);
    hint.style.opacity = 0;
  });

  cv.addEventListener('pointermove', e => {
    par.x = e.clientX / innerWidth - .5;
    par.y = (e.clientY - 60) / (innerHeight - 60) - .5;

    if (!drag) return;

    drag.leaf.t = clamp(
      drag.t0 + (drag.x0 - lx(e)) / (1.7 * W)
    );

    drag.dx = e.clientX - drag.last;
    drag.last = e.clientX;

    drag.moved = Math.max(
      drag.moved,
      Math.hypot(
        e.clientX - drag.px,
        e.clientY - drag.py
      )
    );
  });

  function end() {
    if (!drag) return;

    const { leaf, dir } = drag;

    let tg;

    if (drag.moved < 8 && performance.now() - drag.time < 500) {
      tg = dir > 0 ? 1 : 0;
    } else if (Math.abs(drag.dx) > 8) {
      tg = drag.dx < 0 ? 1 : 0;
    } else {
      tg = leaf.t > .5 ? 1 : 0;
    }

    leaf.target = tg;
    leaf.drag = false;
    drag = null;
  }

  ['pointerup', 'pointercancel'].forEach(n =>
    cv.addEventListener(n, end)
  );

  /* ---------- Camera & Render Loop ---------- */

  let dist = 2.6;
  let needs = true;

  warm();

  function resize() {
    const w = innerWidth;
    const h = Math.max(1, innerHeight - 60);

    renderer.setSize(w, h);

    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    needs = true;

    dist = Math.max(
      2.5,
      2.5 / (
        2 * Math.tan(THREE.MathUtils.degToRad(20)) *
        Math.min(camera.aspect, 1.35)
      )
    );
  }

  addEventListener('resize', resize);
  resize();

  const DEBUG = location.search.indexOf('debug') >= 0;
  const dbg = document.getElementById('dbg');

  let fpsN = 0;
  let fpsT = 0;

  let last = performance.now();
  let spin = 0;

  function frame(now) {
    requestAnimationFrame(frame);

    const raw = (now - last) / 1000;
    const dt = Math.min(.05, raw);

    last = now;

    if (DEBUG) {
      fpsN++;
      fpsT += raw;

      if (fpsT > .5) {
        dbg.textContent =
          dbgInfo +
          ' | ' +
          Math.round(fpsN / fpsT) +
          ' fps | ratio ' +
          pr.toFixed(2);

        fpsN = 0;
        fpsT = 0;
      }
    }

    if (pivot.visible && raw > .03 && raw < .25) {
      if (++slow > 20 && pr > .8) {
        pr = Math.max(.8, pr - .15);
        renderer.setPixelRatio(pr);
        resize();
        slow = 0;
      }
    } else if (slow > 0 && raw < .022) {
      slow--;
    }

    const moving = L.some(l =>
      l.drag || Math.abs(l.target - l.t) > 1e-4
    );

    const mouseMoving =
      Math.abs(par.x - cur.x) +
      Math.abs(par.y - cur.y) > .002;

    if (!(needs || moving || mouseMoving || pivot.visible)) return;

    needs = false;

    for (const l of L) {
      if (!l.drag) {
        const d = l.target - l.t;

        if (Math.abs(d) > 1e-4) {
          l.t += Math.sign(d) *
            Math.min(
              Math.abs(d),
              Math.max(Math.abs(d) * dt * 7, dt * .5)
            );
        } else {
          l.t = l.target;
        }
      }
    }

    let Rt = 0;
    let Lt = 0;

    for (let i = 1; i < N; i++) {
      Rt += 1 - L[i].t;
      Lt += L[i].t;
    }

    let topR = 0;
    let topL = 0;

    for (let i = 1; i < N; i++) {
      if (L[i].t < .001 && !topR) topR = i;
      if (L[i].t > .999) topL = i;
    }

    for (let i = 1; i < N; i++) {
      let a = 0;
      let b = 0;

      for (let j = 1; j < N; j++) {
        if (j > i) a += 1 - L[j].t;
        else if (j < i) b += L[j].t;
      }

      const l = L[i];

      const y0 =
        (BASE + GAP * a) * (1 - l.t) +
        (BASE + GAP * b) * l.t +
        i * .0001;

      l.mf.position.y = l.mb.position.y = y0;

      const isMoving = l.t > .001 && l.t < .999;

      l.mf.visible = l.mb.visible =
        (i === topR && l.t <= .001) ||
        (i === topL && l.t >= .999) ||
        isMoving;

      if (l.t !== l._t) {
        if (isMoving || l._t === -1) update(l);
        l._t = l.t;
      }
    }

    const t0 = L[0].t;

    cp.position.y = (BASE + GAP * Rt) * (1 - t0);
    cp.rotation.z = Math.PI * t0;

    let Rn = 0;
    let Ln = 0;

    for (let i = 1; i < N; i++) {
      if (L[i].t < .001) Rn++;
      else if (L[i].t > .999) Ln++;
    }

    const rh = Math.max(.001, GAP * Rn);
    const lh = Math.max(.001, GAP * Ln);

    rBlock.visible = Rn > 0;
    rBlock.scale.y = rh;
    rBlock.position.y = rh / 2;

    lBlock.visible = Ln > 0;
    lBlock.scale.y = lh;
    lBlock.position.y = lh / 2;

    const sh =
      (BASE + GAP * Rt + 2 * T) *
      (1 - smooth(0, .08, t0));

    spine.visible = sh > .003;
    spine.scale.y = Math.max(.001, sh);

    spine.position.set(
      -.0125,
      -T + sh / 2,
      0
    );

    const o = smooth(0, 1, t0);

    blob.position.x = W * .5 * (1 - o);
    blob.scale.set(1.9 + 1.7 * o, 2.6, 1);

    const turn = smooth(0, .3, L[1].t);
    const vis = 1 - turn;
    const rise = smooth(.3, 1, t0);

    const sxz = fit * (.3 + .7 * vis);
    const show = vis * smooth(.02, .15, t0);

    pivot.visible = modelLoaded && show > .01;

    pivot.scale.set(
      sxz,
      sxz * (.012 + .988 * rise),
      sxz
    );

    pivot.position.set(
      W * .5,
      BASE + GAP * (N - 2) + .01 + turn * .25,
      .03
    );

    spin += dt * .6 * rise;
    pivot.rotation.y = spin + turn * 4;

    cur.x += (par.x - cur.x) * dt * 3;
    cur.y += (par.y - cur.y) * dt * 3;

    const centerOffsetX = (W1 * 0.5) * (1 - o);
    const fixedDist = dist * 0.99;

    camera.position.set(
      centerOffsetX + cur.x * .45,
      fixedDist * .86 - cur.y * .25,
      fixedDist * .52 + cur.y * .32
    );

    camera.lookAt(centerOffsetX, .06, .03);

    renderer.render(scene, camera);
  }

  requestAnimationFrame(frame);
})();
</script>

<script>
let currentLang = "en";

function openMenu() {
  document.getElementById("mobileOverlay").classList.add("active");
}

function closeMenu() {
  document.getElementById("mobileOverlay").classList.remove("active");
}

function toggleLanguage() {
  currentLang = currentLang === "en" ? "fr" : "en";

  document.getElementById("langBtn").innerText =
    currentLang === "en" ? "FR" : "EN";

  document.documentElement.lang = currentLang;

  document.querySelectorAll("[data-en]").forEach((el) => {
    el.innerText = el.getAttribute(`data-${currentLang}`);
  });
}

const currentPage = location.pathname.split("/").pop() || "index.html";

document.querySelectorAll(".button, .mobile-link").forEach((link) => {
  if (link.getAttribute("href") === currentPage) {
    link.setAttribute("aria-current", "page");
  }
});
</script>
