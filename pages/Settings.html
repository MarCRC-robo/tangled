<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manuel</title>
<link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#3a2c22,#120d0a);font-family:Georgia,serif}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#hint{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:#e8d9bd;letter-spacing:.08em;font-size:14px;pointer-events:none;transition:opacity .6s}
</style></head><body>
<div id="hint">Drag the cover to open the book</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const W=1,H=1.4,SEG=14,N=10,GAP=.006,BASE=.004,T=.05,W1=1.02,H1=1.44,
clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),
smooth=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const coarse=matchMedia('(pointer:coarse)').matches;


const renderer=new THREE.WebGLRenderer({antialias:!coarse,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.outputEncoding=THREE.sRGBEncoding;


const cv=renderer.domElement;document.body.appendChild(cv);
const hint=document.getElementById('hint');
addEventListener('error',e=>{hint.style.opacity=1;hint.textContent='Error: '+e.message});
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,50);


{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),q=x.createRadialGradient(64,64,5,64,64,100);q.addColorStop(0,'#3a2c22');q.addColorStop(1,'#120d0a');x.fillStyle=q;x.fillRect(0,0,128,128);const bt=new THREE.CanvasTexture(c);bt.encoding=THREE.sRGBEncoding;scene.background=bt}
scene.add(new THREE.HemisphereLight(0xfff2dd,0x4a3a2a,.95));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(-2,4,3);scene.add(sun);
const book=new THREE.Group();scene.add(book);


function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}


function tex(draw,w=512,h=724){
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const g=c.getContext('2d');draw(g);
 const t=new THREE.CanvasTexture(c);
 t.encoding=THREE.sRGBEncoding;
 t.needsUpdate=true;
 return t;
}


// Pages d'un blanc pur (#ffffff)
function paper(g,spineLeft,num,title,lines){
 g.fillStyle='#ffffff';
 g.fillRect(0,0,512,724);
 const gr=g.createLinearGradient(spineLeft?0:512,0,spineLeft?90:422,0);
 gr.addColorStop(0,'rgba(0,0,0,.12)');gr.addColorStop(1,'rgba(0,0,0,0)');
 g.fillStyle=gr;g.fillRect(0,0,512,724);
 g.fillStyle='#4a3b2c';g.textAlign='center';
 if(title){g.font='bold 40px Georgia';g.fillText(title,256,110)}
 const r=rnd((+num||3)*31+7);g.fillStyle='rgba(70,60,50,.22)';
 for(let i=0;i<lines;i++)g.fillRect(66,(title&&lines<5?520:170)+i*30,300+r()*80,7);
 g.font='22px Georgia';g.fillStyle='#4a3b2c';g.fillText(num,256,680);
}


function endpaper(g){
 g.fillStyle='#3b153e';g.fillRect(0,0,512,724);g.fillStyle='rgba(212,175,55,.35)';
 for(let y=20,j=0;y<724;y+=48,j++)for(let x=j%2?24:0;x<530;x+=48){
  g.beginPath();g.moveTo(x,y-7);g.lineTo(x+4,y);g.lineTo(x,y+7);g.lineTo(x-4,y);g.fill();
 }
}


/* ---------- Reproduire EXACTEMENT l'image Disney en Violet + "Manuel" ---------- */
function coverArt(g){
 const w=1024,h=1448,TAU=Math.PI*2, r=rnd(9);
 
 // Fond violet cuir profond
 const bgGrad = g.createRadialGradient(w/2, h/2, 100, w/2, h/2, 900);
 bgGrad.addColorStop(0, '#59205e');
 bgGrad.addColorStop(0.6, '#3e1542');
 bgGrad.addColorStop(1, '#230a26');
 g.fillStyle = bgGrad;
 g.fillRect(0, 0, w, h);


 // Grain de cuir subtil
 for(let i=0; i<35000; i++){
  g.fillStyle = r() > 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.06)';
  g.fillRect(r()*w, r()*h, 2, 2);
 }


 // Dégradé feuille d'or antique
 const goldG = (y0, y1) => {
  const q = g.createLinearGradient(0, y0, 0, y1);
  q.addColorStop(0, '#fff6ce');
  q.addColorStop(0.3, '#e2b84c');
  q.addColorStop(0.7, '#a5791a');
  q.addColorStop(1, '#664906');
  return q;
 };
 const gold = goldG(0, h);


 // 1. Surpiqûre dorée extérieure (Pointillés)
 g.strokeStyle = gold;
 g.lineWidth = 4;
 g.setLineDash([12, 8]);
 g.strokeRect(36, 36, w - 72, h - 72);
 g.setLineDash([]);


 // 2. Double encadrement crénelé
 g.lineWidth = 5;
 g.strokeRect(58, 58, w - 116, h - 116);
 g.lineWidth = 2.5;
 g.strokeRect(74, 74, w - 148, h - 148);


 // 3. Arabesques dorées des 4 coins (Réplique exacte de la photo)
 function drawCornerPattern(cx, cy, rx, ry){
  g.save();
  g.translate(cx, cy);
  g.scale(rx, ry);
  g.fillStyle = gold;
  g.strokeStyle = gold;
  g.lineWidth = 5;


  // Grande volute d'angle
  g.beginPath();
  g.moveTo(35, 230);
  g.bezierCurveTo(50, 110, 110, 50, 230, 35);
  g.bezierCurveTo(140, 75, 75, 140, 35, 230);
  g.fill();


  // Enroulements secondaires
  g.beginPath(); g.arc(160, 95, 28, 0, TAU); g.fill();
  g.beginPath(); g.arc(95, 160, 28, 0, TAU); g.fill();
  g.beginPath(); g.arc(130, 130, 42, Math.PI*0.8, Math.PI*1.8); g.stroke();


  g.restore();
 }
 drawCornerPattern(74, 74, 1, 1);
 drawCornerPattern(w - 74, 74, -1, 1);
 drawCornerPattern(74, h - 74, 1, -1);
 drawCornerPattern(w - 74, h - 74, -1, -1);


 // 4. Fleur de Lys supérieure
 g.save();
 g.translate(w/2, 135);
 g.fillStyle = gold;
 g.beginPath();
 g.moveTo(0, -38); g.quadraticCurveTo(22, 0, 0, 38); g.quadraticCurveTo(-22, 0, 0, -38);
 g.fill();
 g.beginPath(); g.arc(-26, 12, 15, 0, TAU); g.fill();
 g.beginPath(); g.arc(26, 12, 15, 0, TAU); g.fill();
 g.fillRect(-24, 20, 48, 7);
 g.restore();


 // 5. 3 Motifs losanges sur le côté gauche
 [430, 724, 1018].forEach(yPos => {
  g.save();
  g.translate(145, yPos);
  g.fillStyle = gold;
  g.beginPath();
  g.moveTo(0, -20); g.lineTo(16, 0); g.lineTo(0, 20); g.lineTo(-16, 0);
  g.closePath();
  g.fill();
  g.restore();
 });


 // 6. Grand motif baroque inférieur (Fleuron sculpté)
 g.save();
 g.translate(w/2, h - 190);
 g.fillStyle = gold;
 g.strokeStyle = gold;
 g.lineWidth = 6;
 g.beginPath(); g.arc(0, -42, 28, 0, TAU); g.fill();
 g.beginPath();
 g.moveTo(0, -10);
 g.bezierCurveTo(-150, 10, -210, -55, -250, 35);
 g.bezierCurveTo(-170, 55, -90, 15, 0, 55);
 g.bezierCurveTo(90, 15, 170, 55, 250, 35);
 g.bezierCurveTo(210, -55, 150, 10, 0, -10);
 g.fill();
 g.restore();


 // 7. Fermoir Métallique Baroque (Côté droit)
 g.save();
 g.translate(w - 74, 724);
 g.fillStyle = gold;
 g.strokeStyle = '#231302';
 g.lineWidth = 5;
 g.beginPath();
 g.arc(-10, 0, 48, -Math.PI/2, Math.PI/2);
 g.closePath();
 g.fill(); g.stroke();
 g.beginPath();
 g.moveTo(-60, -9); g.lineTo(12, -9); g.lineTo(12, 9); g.lineTo(-60, 9);
 g.fill(); g.stroke();
 g.restore();


 // 8. Titre "Manuel" (Calligraphie d'origine)
 g.save();
 g.textAlign = 'center';
 g.textBaseline = 'middle';
 const titleY = 670;
 g.font = 'italic 700 200px Almendra, Georgia, serif';


 // Ombre sculptée
 g.lineWidth = 14;
 g.strokeStyle = '#150317';
 g.shadowColor = 'rgba(0,0,0,0.9)';
 g.shadowBlur = 18;
 g.shadowOffsetY = 8;
 g.strokeText('Manuel', w/2 - 10, titleY);


 g.shadowColor = 'transparent';
 g.fillStyle = goldG(titleY - 90, titleY + 70);
 g.fillText('Manuel', w/2 - 10, titleY);


 // Reflet brillant d'or pur
 g.lineWidth = 3;
 g.strokeStyle = '#fffadb';
 g.strokeText('Manuel', w/2 - 10, titleY);
 g.restore();
}


/* ---------- Hardcover ---------- */
const purpleCoverMat=new THREE.MeshBasicMaterial({color:0x3e1542});
const coverTex=tex(coverArt,1024,1448),endTex=tex(endpaper),endFlip=tex(endpaper);
endFlip.repeat.set(-1,-1);endFlip.offset.set(1,1);
const mat=m=>new THREE.MeshBasicMaterial(m);
const cp=new THREE.Group(),front=new THREE.Mesh(new THREE.BoxGeometry(W1,T,H1),
 [purpleCoverMat,purpleCoverMat,mat({map:coverTex}),mat({map:endFlip}),purpleCoverMat,purpleCoverMat]);
front.position.set(W1/2,T/2,0);cp.add(front);book.add(cp);
const back=new THREE.Mesh(new THREE.BoxGeometry(W1,T,H1),[purpleCoverMat,purpleCoverMat,mat({map:endTex}),purpleCoverMat,purpleCoverMat,purpleCoverMat]);
back.position.set(W1/2,-T/2,0);book.add(back);


const strip=new THREE.Mesh(new THREE.BoxGeometry(.02,T,H1),purpleCoverMat);strip.position.set(0,-T/2,0);book.add(strip);
const spine=new THREE.Mesh(new THREE.BoxGeometry(.025,1,H1),purpleCoverMat);book.add(spine);


const blockMat=new THREE.MeshBasicMaterial({color:0xffffff});
const rBlock=new THREE.Mesh(new THREE.BoxGeometry(W,1,H),blockMat),lBlock=new THREE.Mesh(new THREE.BoxGeometry(W,1,H),blockMat);
rBlock.position.x=W/2;lBlock.position.x=-W/2;book.add(rBlock,lBlock);


/* ---------- Paper sheets ---------- */
function makeLeaf(i,frontTex,backTex){
 const geo=new THREE.BufferGeometry(),n=(SEG+1)*2,uv=new Float32Array(n*2),idx=[];
 geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
 for(let k=0;k<=SEG;k++){uv.set([k/SEG,1,k/SEG,0],k*4);
  if(k<SEG){const a=k*2,b=a+1,c=a+2,d=a+3;idx.push(a,b,c,b,d,c)}}
 geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));geo.setIndex(idx);


 const matF=new THREE.MeshBasicMaterial({map:frontTex,polygonOffset:true,polygonOffsetFactor:-2-i,polygonOffsetUnits:-2-i});
 const matB=new THREE.MeshBasicMaterial({map:backTex,side:THREE.BackSide,polygonOffset:true,polygonOffsetFactor:-2-i,polygonOffsetUnits:-2-i});


 const mf=new THREE.Mesh(geo,matF);
 const mb=new THREE.Mesh(geo,matB);
 mf.frustumCulled=mb.frustumCulled=false;book.add(mf,mb);
 return{i,w:W,h:H,geo,mf,mb,bend:.65,t:0,target:0,drag:false,_t:-1}}


const L=[{t:0,target:0,drag:false}];
for(let i=1;i<N;i++){
 const tF = tex(g=>paper(g,true,String(2*i-1),i===1?'Welcome':'Chapter '+i,i===1?3:14));
 const tB = tex(g=>paper(g,false,String(2*i),null,15));
 tB.repeat.x=-1;tB.offset.x=1;
 L.push(makeLeaf(i,tF,tB));
}


function update(l){
 const th=Math.PI*l.t,B=l.bend*Math.sin(th),p=l.geo.attributes.position;
 for(let k=0;k<=SEG;k++){const s=k/SEG;let x,y;
  if(B<1e-4){x=l.w*s*Math.cos(th);y=l.w*s*Math.sin(th)}
  else{
   const R = l.w / Math.max(1e-4, B);
   x=R*(Math.sin(th)-Math.sin(th-B*s));
   y=R*(Math.cos(th-B*s)-Math.cos(th));
  }
  p.setXYZ(k*2,x,y,-l.h/2);p.setXYZ(k*2+1,x,y,l.h/2)}
 p.needsUpdate=true;l.geo.computeVertexNormals()}


/* ---------- Shadow ---------- */
const sc=document.createElement('canvas');sc.width=sc.height=128;const sg=sc.getContext('2d'),sr=sg.createRadialGradient(64,64,10,64,64,64);
sr.addColorStop(0,'rgba(0,0,0,.65)');sr.addColorStop(1,'rgba(0,0,0,0)');sg.fillStyle=sr;sg.fillRect(0,0,128,128);
const blob=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
blob.rotation.x=-Math.PI/2;blob.position.y=-T-.01;scene.add(blob);


/* ---------- 3D gem design ---------- */
const pivot=new THREE.Group(),mats=[];let fit=1;pivot.visible=false;book.add(pivot);
const designGroup = new THREE.Group();
const gemGeo = new THREE.OctahedronGeometry(0.35, 1);
const gemMat = new THREE.MeshPhongMaterial({color:0x9b51e0,emissive:0x3c1053,specular:0xffffff,shininess:100,flatShading:true});
const gem = new THREE.Mesh(gemGeo, gemMat);gem.position.y = 0.45;designGroup.add(gem);
const ringGeo = new THREE.TorusGeometry(0.5, 0.02, 16, 40);
const ringMat = new THREE.MeshStandardMaterial({color:0xe3b64d,metalness:0.8,roughness:0.2});
const ring = new THREE.Mesh(ringGeo, ringMat);ring.position.y = 0.45;ring.rotation.x = Math.PI / 3;designGroup.add(ring);
const baseGeo = new THREE.CylinderGeometry(0.2, 0.3, 0.1, 8);
const baseMat = new THREE.MeshStandardMaterial({ color: 0x4a2e1b, roughness: 0.6 });
const baseMesh = new THREE.Mesh(baseGeo, baseMat);baseMesh.position.y = 0.05;designGroup.add(baseMesh);


const box = new THREE.Box3().setFromObject(designGroup);
const size = box.getSize(new THREE.Vector3());
const c = box.getCenter(new THREE.Vector3());
designGroup.position.set(-c.x, -box.min.y, -c.z);
pivot.add(designGroup);
fit = .8 / Math.max(size.x, size.y, size.z);
designGroup.traverse(o => {if (o.isMesh) {o.material = o.material.clone();o.material.transparent = true;mats.push(o.material);}});


function warm(){
  scene.traverse(o=>{[].concat(o.material||[]).forEach(m=>{if(m.map){m.map.needsUpdate=true;renderer.initTexture(m.map)}})});
  const v=pivot.visible;pivot.visible=true;renderer.compile(scene,camera);pivot.visible=v;
}
document.fonts&&document.fonts.load("italic 700 100px Almendra").then(()=>coverTex.redraw()).catch(()=>{});


/* ---------- Interaction ---------- */
const ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-.05),pt=new THREE.Vector3(),v2=new THREE.Vector2(),par={x:0,y:0},cur={x:0,y:0};
function lx(e){v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,camera);ray.ray.intersectPlane(plane,pt);return pt.x}
let drag=null;
cv.addEventListener('pointerdown',e=>{
 const x=lx(e),turned=L.filter(l=>l.target===1).length;let leaf=null,dir=0;
 if(x>0&&turned<N){leaf=L[turned];dir=1}else if(x<0&&turned>0){leaf=L[turned-1];dir=-1}
 if(!leaf)return;
 drag={leaf,dir,x0:x,t0:leaf.t,px:e.clientX,py:e.clientY,time:performance.now(),dx:0,last:e.clientX,moved:0};
 leaf.drag=true;cv.setPointerCapture(e.pointerId);hint.style.opacity=0});
cv.addEventListener('pointermove',e=>{
 par.x=e.clientX/innerWidth-.5;par.y=e.clientY/innerHeight-.5;if(!drag)return;
 drag.leaf.t=clamp(drag.t0+(drag.x0-lx(e))/(1.7*W));
 drag.dx=e.clientX-drag.last;drag.last=e.clientX;
 drag.moved=Math.max(drag.moved,Math.hypot(e.clientX-drag.px,e.clientY-drag.py))});
function end(){if(!drag)return;const{leaf,dir}=drag;let tg;
 if(drag.moved<8&&performance.now()-drag.time<500)tg=dir>0?1:0;
 else if(Math.abs(drag.dx)>8)tg=drag.dx<0?1:0;
 else tg=leaf.t>.5?1:0;
 leaf.target=tg;leaf.drag=false;drag=null}
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,end));


/* ---------- Loop ---------- */
let dist=4,needs=true;warm();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();needs=true;
 dist=Math.max(3.3,2.8/(2*Math.tan(THREE.MathUtils.degToRad(20))*camera.aspect))}
addEventListener('resize',resize);resize();


let last=performance.now(),spin=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-last)/1000);last=now;


 const moving = L.some(l=>l.drag||Math.abs(l.target-l.t)>1e-4);
 const mouseMoving = Math.abs(par.x-cur.x)+Math.abs(par.y-cur.y)>.002;
 if(!(needs||moving||mouseMoving||pivot.visible))return;
 needs=false;


 for(const l of L)if(!l.drag){const d=l.target-l.t;
  if(Math.abs(d)>1e-4)l.t+=Math.sign(d)*Math.min(Math.abs(d),Math.max(Math.abs(d)*dt*7,dt*.5));else l.t=l.target}


 let Rt=0,Lt=0;for(let i=1;i<N;i++){Rt+=1-L[i].t;Lt+=L[i].t}
 let topR=0,topL=0;for(let i=1;i<N;i++){if(L[i].t<.001&&!topR)topR=i;if(L[i].t>.999)topL=i}


 for(let i=1;i<N;i++){
  let a=0,b=0;for(let j=1;j<N;j++){if(j>i)a+=1-L[j].t;else if(j<i)b+=L[j].t}
  const l=L[i],y0=(BASE+GAP*a)*(1-l.t)+(BASE+GAP*b)*l.t + i*.0001;
  l.mf.position.y=l.mb.position.y=y0;
 
  const isMoving = l.t>.001 && l.t<.999;
  l.mf.visible=l.mb.visible= (i===topR && l.t<=.001) || (i===topL && l.t>=.999) || isMoving;


  if(l.t!==l._t){if(isMoving||l._t===-1)update(l);l._t=l.t}
 }


 const t0=L[0].t;
 cp.position.y=(BASE+GAP*Rt)*(1-t0);
 cp.rotation.z=Math.PI*t0;
 let Rn=0,Ln=0;for(let i=1;i<N;i++){if(L[i].t<.001)Rn++;else if(L[i].t>.999)Ln++}
 const rh=Math.max(.001,GAP*Rn),lh=Math.max(.001,GAP*Ln);
 rBlock.visible=Rn>0;rBlock.scale.y=rh;rBlock.position.y=rh/2;
 lBlock.visible=Ln>0;lBlock.scale.y=lh;lBlock.position.y=lh/2;


 const sh=(BASE+GAP*Rt+2*T)*(1-smooth(0,.08,t0));
 spine.visible=sh>.003;spine.scale.y=Math.max(.001,sh);spine.position.set(-.0125,-T+sh/2,0);
 const o=smooth(0,1,t0);blob.position.x=W*.5*(1-o);blob.scale.set(1.9+1.7*o,2.6,1);


 const turn=smooth(0,.3,L[1].t),vis=1-turn,rise=smooth(.3,1,t0);
 const sxz=fit*(.3+.7*vis);
 const show=vis*smooth(.02,.15,t0);
 pivot.visible=show>.01;
 pivot.scale.set(sxz,sxz*(.012+.988*rise),sxz);
 pivot.position.set(W*.5,BASE+GAP*(N-2)+.004+turn*.25,.03);
 spin+=dt*.6*rise;pivot.rotation.y=spin+turn*4;
 ring.rotation.z += dt * 0.5;
 mats.forEach(m=>{m.opacity=show;m.transparent=show<.999});


 cur.x+=(par.x-cur.x)*dt*3;cur.y+=(par.y-cur.y)*dt*3;
 camera.position.set(.2+cur.x*.6,dist*.85-cur.y*.3,dist*.53+cur.y*.4);camera.lookAt(.2,.1,.05);
 renderer.render(scene,camera)}
requestAnimationFrame(frame);
})();
</script></body></html>
