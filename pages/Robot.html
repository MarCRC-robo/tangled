<!doctype html>
<html>
  <head>
    <title>Robot-Library</title>
    <style>
      body {
        margin: 0;
        padding-top: 60px;
      }
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: #d8bddb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 80px 0 20px; /* Right padding leaves space for sliding logo */
        box-sizing: border-box;
        z-index: 1000;
        transform-origin: left center;
        transition:
          transform 0.6s ease-in-out,
          opacity 0.6s ease-in-out;
      }

      .links a:hover {
        font-weight: bold;
      }

      .logo {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .logo img {
        width: 40px; /* Reduced slightly to fit neatly inside 60px bar height */
        height: auto;
        display: block;
      }

      .links {
        display: flex;
        align-items: center;
        margin-left: 20px; /* Adds space between logo and first link */
        margin-right: auto; /* Pushes the language button to the far right */
      }

      .links a {
        color: #eae85d;
        text-decoration: none;
        margin-right: 20px; /* Keeps consistent spacing between links */
        font-family: Arial, sans-serif;
        font-weight: 500;
        white-space: nowrap;
      }

      .lang-btn {
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 5px 12px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }

      .image-container {
        width: 100%;
        position: relative;
      }
      .image-container img {
        display: block;
        width: 100%;
        height: auto;
      }
      .glow-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        opacity: 0.9;
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .glow-overlay:hover {
        opacity: 1;
        filter: drop-shadow(0 0 15px rgba(255, 230, 100, 0.9)) brightness(1.3);
      }

      /* --- L'OVERLAY SOMBRE ET LE LIVRE --- */
      #bookOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }

      /* LA BOÎTE DU LIVRE */
      #bookBox {
        width: 320px;
        height: 480px;
        background: #edd0f7;
        color: #2c2c2c;
        border: 4px solid #c737d4;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        position: relative;
        transform: scale(0.1);
        transition:
          transform 0.4s ease,
          width 0.5s ease;
      }

      /* Quand le livre est ouvert */
      #bookBox.open {
        width: 800px;
      }

      /* Quand l'overlay est actif */
      #bookOverlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      #bookOverlay.active #bookBox {
        transform: scale(1);
      }

      /* Bouton de fermeture */
      #closeBtn {
        position: absolute;
        top: 10px;
        right: 20px;
        font-size: 30px;
        cursor: pointer;
        z-index: 10;
      }

      .hidden {
        display: none !important;
      }

      /* --- GESTION DES PAGES --- */
      #pagesScreen {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        position: relative;
      }

      /* Caché par défaut */
      .page-spread {
        display: none;
        width: 100%;
        height: 100%;
        gap: 15px;
        box-sizing: border-box;
      }

      /* Affiché uniquement quand c'est la double-page active */
      .page-spread.active {
        display: flex;
      }

      /* Style des pages */
      .page {
        flex: 1;
        height: 100%;
        background: #fdfbf7;
        color: #2c2c2c;
        padding: 20px;
        border-radius: 4px;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        box-sizing: border-box;
      }

      /* Boutons de navigation */
      .nav-buttons {
        position: absolute;
        bottom: -10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <!-- Place logo first -->
      <a class="logo" href="Home.html">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>

      <!-- Navigation Links -->
      <div class="links">
        <a href="Home.html" data-en="Home" data-fr="Accueil">Home</a>
        <a href="2ndHome.html" data-en="Scenes" data-fr="Scenes">Scenes</a>

        <a href="Robot.html" data-en="Robot" data-fr="Robot">Robot</a>
        <a href="Arcade.html" data-en="Arcade" data-fr="Arcade">Arcade</a>
        <a href="Timeline.html" data-en="Timeline" data-fr="Chronologie"
          >Timeline</a
        >
        <a href="Sponsors.html" data-en="Sponsors" data-fr="Commanditaires"
          >Sponsors</a
        >
        <a href="Team.html" data-en="Team" data-fr="Équipe">Team</a>
      </div>

      <!-- Language Button -->
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>
    </div>

    <div class="image-container">
      <img
        src="../images/background.png"
        alt="Rapunzel and Flynn reading a book on the floor"
      />
      <img
        src="../images/foreground.png"
        id="foreground"
        alt="Rapunzel and Flynn reading a book on the floor"
        class="glow-overlay"
      />
    </div>
    <div id="bookOverlay">
      <div id="bookBox">
        <span id="closeBtn">&times;</span>

        <!-- PAQUET 1 : La couverture -->
        <div id="coverScreen">
          <h2>Livre des Robots</h2>
          <button id="openBookBtn">Ouvrir le livre</button>
        </div>

        <!-- PAQUET 2 : Les pages du livre -->
        <div id="pagesScreen" class="hidden">
          <!-- DOUBLE PAGE 1 (Pages 1 et 2) -->
          <div class="page-spread active">
            <div class="page">
              <h3>Page 1</h3>
              <p>Ton texte pour la page 1...</p>
            </div>
            <div class="page">
              <h3>Page 2</h3>
              <p>Ton texte pour la page 2...</p>
            </div>
          </div>

          <!-- DOUBLE PAGE 2 (Pages 3 et 4) -->
          <div class="page-spread">
            <div class="page">
              <h3>Page 3</h3>
              <p>Ton texte pour la page 3...</p>
            </div>
            <div class="page">
              <h3>Page 4</h3>
              <p>Ton texte pour la page 4...</p>
            </div>
          </div>

          <!-- Boutons de navigation tout en bas -->
          <div class="nav-buttons">
            <button id="prevBtn">◄ Précédent</button>
            <button id="nextBtn">Suivant ►</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      let currentLang = "en";

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";
        document.documentElement.lang = currentLang;

        const elementsToTranslate = document.querySelectorAll("[data-en]");
        elementsToTranslate.forEach((element) => {
          element.innerText = element.getAttribute(`data-${currentLang}`);
        });
      }
      // 1. Sélection des éléments principaux
      const foreground = document.getElementById("foreground");
      const bookOverlay = document.getElementById("bookOverlay");
      const closeBtn = document.getElementById("closeBtn");
      const openBookBtn = document.getElementById("openBookBtn");
      const coverScreen = document.getElementById("coverScreen");
      const pagesScreen = document.getElementById("pagesScreen");
      const bookBox = document.getElementById("bookBox");

      // 2. Sélection des éléments de navigation des pages
      const spreads = document.querySelectorAll(".page-spread");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      let currentSpread = 0;

      // Clic sur l'image pour ouvrir l'overlay
      foreground.addEventListener("click", function () {
        bookOverlay.classList.add("active");
      });

      // Clic sur "Ouvrir le livre"
      openBookBtn.addEventListener("click", function () {
        coverScreen.classList.add("hidden");
        pagesScreen.classList.remove("hidden");
        bookBox.classList.add("open");
      });

      // Clic sur la croix pour fermer et remettre à zéro
      closeBtn.addEventListener("click", function () {
        bookOverlay.classList.remove("active");
        coverScreen.classList.remove("hidden");
        pagesScreen.classList.add("hidden");
        bookBox.classList.remove("open");
        showSpread(0); // Revient aux pages 1 & 2 pour la prochaine fois
      });

      // Fonction pour changer de double-page
      function showSpread(index) {
        spreads[currentSpread].classList.remove("active");
        currentSpread = index;
        spreads[currentSpread].classList.add("active");
      }

      // Clic sur "Suivant ►"
      nextBtn.addEventListener("click", function () {
        if (currentSpread < spreads.length - 1) {
          showSpread(currentSpread + 1);
        }
      });

      // Clic sur "◄ Précédent"
      prevBtn.addEventListener("click", function () {
        if (currentSpread > 0) {
          showSpread(currentSpread - 1);
        }
      });
    </script>
  </body>
</html>
