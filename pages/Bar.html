<!doctype html>
<html lang="en">
  <head>
    <title>Marcy let down your hair</title>
    <style>
      body {
        margin: 0;
        padding-top: 60px;
        /* Background Image Settings */
        background-image: url("../images/thebar.png"); /* Adjust path if needed */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
      }

      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: rgba(
          216,
          189,
          219,
          0.9
        ); /* Added slight transparency */
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 80px 0 20px; /* Right padding leaves space for sliding logo */
        box-sizing: border-box;
        z-index: 1000;
        transform-origin: left center;
        transition:
          transform 0.6s ease-in-out,
          opacity 0.6s ease-in-out;
      }

      .links a:hover {
        font-weight: bold;
      }

      .logo {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .logo img {
        width: 40px; /* Reduced slightly to fit neatly inside 60px bar height */
        height: auto;
        display: block;
      }

      .links {
        display: flex;
        align-items: center;
        margin-left: 20px; /* Adds space between logo and first link */
        margin-right: auto; /* Pushes the language button to the far right */
      }

      .links a {
        color: #eae85d;
        text-decoration: none;
        margin-right: 20px; /* Keeps consistent spacing between links */
        font-family: Arial, sans-serif;
        font-weight: 500;
        white-space: nowrap;
      }

      .lang-btn {
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 5px 12px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }

      .bar-door {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        width: 60px;
        position: fixed; /* Fixed so it remains clickable outside the bar flow */
        top: 110px;
        left: 335px;
        z-index: 1800;
        transition: left 0.6s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <!-- Place logo first -->
      <a class="logo" href="Home.html">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>

      <!-- Navigation Links -->
      <div class="links">
        <a href="Home.html" data-en="Home" data-fr="Accueil">Home</a>
        <a href="Robot.html" data-en="Robot" data-fr="Robot">Robot</a>
        <a href="Arcade.html" data-en="Arcade" data-fr="Arcade">Arcade</a>
        <a href="Timeline.html" data-en="Timeline" data-fr="Chronologie"
          >Timeline</a
        >
        <a href="Sponsors.html" data-en="Sponsors" data-fr="Commanditaires"
          >Sponsors</a
        >
        <a href="Team.html" data-en="Team" data-fr="Équipe">Team</a>
      </div>

      <button class="bar-door" oneclick="opendoor()" id="bar-door">
        <img src="../images/bar-door.png" alt="bar-door" />
      </button>

      <!-- Language Button -->
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>
    </div>
    <script>
      let currentLang = "en";

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";
        document.documentElement.lang = currentLang;

        const elementsToTranslate = document.querySelectorAll("[data-en]");
        elementsToTranslate.forEach((element) => {
          element.innerText = element.getAttribute(`data-${currentLang}`);
        });
      }

      function opendoor() {
        const bardoor = document.getElementById("bar-door");
      }
    </script>
  </body>
</html>
