<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Old TV + DVD</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe                                                                          -area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#17110e;font-family:"Trebuchet MS",Verdana,sans-serif}
body{background:radial-gradient(ellipse at 50% 35%,#4a3a30 0%,#271d17 60%,#150f0c 100%)}
#tv{position:absolute;left:0;top:0;width:760px;height:660px;transform-origin:0 0;will-change:transform}
#tv.anim{transition:transform 2s cubic-bezier(.65,0,.25,1)}
.shelf{position:absolute;left:-70px;top:658px;width:900px;height:30px;background:linear-gradient(#7a5434,#4b311c);border-radius:4px;box-shadow:0 20px 40px #000a}
.cab{position:absolute;inset:0;border-radius:20px;background:linear-gradient(160deg,#d9dcde,#b5b9bc 55%,#9da1a4);box-shadow:inset 0 2px 0 #fff8,inset 0 -6px 14px #0004,0 18px 40px #000a;transition:opacity .6s}
.zoomed .cab,.zoomed .panel{opacity:0}
.bezel{position:absolute;left:42px;top:30px;width:676px;height:514px;border-radius:26px;background:#101314;box-shadow:inset 0 0 0 3px #2a2f31,0 2px 0 #fff6}
.scr{position:absolute;left:56px;top:44px;width:648px;height:486px;border-radius:34px/28px;overflow:hidden;background:#000;box-shadow:0 0 30px #5da2ff33;transition:border-radius 1.6s}
.zoomed .scr{border-radius:0}
.scr canvas{width:100%;height:100%;display:block}
.glass{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0003 2px 3px),radial-gradient(ellipse at 50% 45%,#0000 55%,#0009 100%);box-shadow:inset 0 0 40px #0008}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#fff2 0,#fff0 28%)}
.brand{position:absolute;top:550px;font-size:12px;letter-spacing:.5px;color:#4b5053;font-weight:700}
.panel{position:absolute;inset:0;transition:opacity .6s}
.slot{position:absolute;background:#171a1b;border-radius:4px;box-shadow:inset 0 3px 6px #000,0 1px 0 #fff9}
.vhs{left:56px;top:582px;width:330px;height:24px}
.vhs::after{content:"VHS";position:absolute;left:10px;top:5px;font-size:10px;color:#8a9094;letter-spacing:2px}
.dvdslot{left:420px;top:582px;width:284px;height:14px}
.btns{position:absolute;top:618px;height:14px;display:flex;gap:7px;align-items:center}
.btns i{width:26px;height:10px;border-radius:2px;background:linear-gradient(#e9ebec,#8f9396);box-shadow:0 1px 1px #0006}
.btns b{width:9px;height:9px;border-radius:50%;background:#2a2f31;box-shadow:inset 0 0 0 2px #0006}
.btns b.led{background:#ff2b2b;box-shadow:0 0 6px #f22}
.bay{position:absolute;left:424px;top:596px;width:276px;height:56px;overflow:hidden}
.tray{position:absolute;left:0;top:0;width:100%;height:46px;background:linear-gradient(#cfd2d4,#9a9ea1);border-radius:0 0 8px 8px;box-shadow:0 3px 6px #0006;transition:transform 1.1s cubic-bezier(.5,0,.3,1)}
.tray.closed{transform:translateY(-108%)}
#disc{position:absolute;left:50%;top:50%;width:132px;height:36px;margin:-18px 0 0 -66px;padding:0;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(ellipse,#222 0 9%,#e8e8ef 10% 18%,#0000 19%),conic-gradient(#dff,#d6b8ff,#ffe3c2,#b7d7ff,#c9ffd9,#dff);box-shadow:0 2px 4px #0008}
#disc:focus-visible{outline:3px solid #ffd23b;outline-offset:3px}
#disc.pulse{animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 7px #ffd23b55,0 2px 4px #0008}}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:#e9d9c8;font-size:14px;transition:opacity .5s;pointer-events:none}
#reset{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;opacity:0;pointer-events:none;transition:opacity .6s;background:#000a;color:#fff;border:1px solid #fff5;border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer}
#reset.show{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#tv.anim{transition-duration:.01s}.tray{transition-duration:.01s}#disc.pulse{animation:none}}
</style>
</head>
<body>
<div id="tv">
  <div class="shelf"></div>
  <div class="cab"></div>
  <div class="bezel"></div>
  <div class="scr"><canvas id="screen" width="640" height="480"></canvas><div class="glass"></div></div>
  <div class="panel">
    <div class="brand" style="left:56px">RETROVISION</div>
    <div class="brand" style="left:604px">DVD VIDEO</div>
    <div class="slot vhs"></div>
    <div class="btns" style="left:56px"><i></i><i></i><i></i><i></i><b class="led"></b></div>
    <div class="slot dvdslot"></div>
    <div class="bay"><div class="tray" id="tray"><button id="disc" class="pulse" aria-label="Push the disc into the player"></button></div></div>
    <div class="btns" style="left:420px"><b></b><i></i><i></i><i></i></div>
  </div>
</div>
<div id="hint">Click the disc to load it</div>
<button id="reset">Eject disc</button>

<script>
const tv=document.getElementById('tv'),cv=document.getElementById('screen'),ctx=cv.getContext('2d'),
  tray=document.getElementById('tray'),disc=document.getElementById('disc'),
  hint=document.getElementById('hint'),reset=document.getElementById('reset');
const W=640,H=480,TW=760,TH=660,SX=56,SY=44,SW=648,SH=486;
const src=document.createElement('canvas');src.width=W;src.height=H;const sc=src.getContext('2d');
const sm=document.createElement('canvas'),smc=sm.getContext('2d');
let scene='bounce',bs=1,noise=0,zoomed=false,busy=false;

/* ---------- bouncing logo ---------- */
const cols=['#ff3b6b','#34d1ff','#ffd23b','#7dff6b','#c77dff','#ff9a3b'];
let ci=0,x=70,y=90,vx=2.4,vy=1.9;const LW=130,LH=64;
const stars=Array.from({length:60},(_,i)=>[(i*97%W),(i*53%H),(i%3)+1]);
function drawBounce(c){
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1d66');g.addColorStop(1,'#02041a');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='#fff8';stars.forEach(s=>c.fillRect(s[0],s[1],s[2]*.8,s[2]*.8));
  x+=vx;y+=vy;let hit=0;
  if(x<=0||x+LW>=W){vx=-vx;hit=1;x=Math.max(0,Math.min(W-LW,x))}
  if(y<=0||y+LH>=H){vy=-vy;hit=1;y=Math.max(0,Math.min(H-LH,y))}
  if(hit)ci=(ci+1)%cols.length;
  c.fillStyle=cols[ci];c.strokeStyle=cols[ci];
  c.font='italic 900 46px "Arial Black",Impact,sans-serif';c.textAlign='center';c.textBaseline='alphabetic';
  c.fillText('DVD',x+LW/2,y+42);
  c.lineWidth=3;c.beginPath();c.ellipse(x+LW/2,y+54,LW/2,9,0,0,7);c.stroke();
  c.font='bold 9px sans-serif';c.fillText('VIDEO',x+LW/2,y+57);
}
/* ---------- disc menu ---------- */
function drawMenu(c){
  const g=c.createRadialGradient(W/2,H*.4,40,W/2,H/2,420);g.addColorStop(0,'#2f6bff');g.addColorStop(1,'#050b3a');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='#fff';c.textAlign='center';c.font='bold 56px Georgia,serif';c.fillText('Movie Night',W/2,170);
  c.font='20px Georgia,serif';c.fillStyle='#bcd1ff';c.fillText('Widescreen Edition',W/2,205);
  [['Play Movie',300],['Scene Selection',350],['Setup',400]].forEach(([t,yy],i)=>{
    if(i===0){c.fillStyle='#fff3';c.fillRect(W/2-130,yy-30,260,42)}
    c.fillStyle='#fff';c.font='24px Georgia,serif';c.fillText(t,W/2,yy);
  });
}
/* ---------- render with pixelation + noise ---------- */
function frame(){
  (scene==='bounce'?drawBounce:drawMenu)(sc);
  if(bs<=1&&noise<=0){ctx.drawImage(src,0,0)}
  else{
    const w=Math.max(1,Math.ceil(W/bs)),h=Math.max(1,Math.ceil(H/bs));
    sm.width=w;sm.height=h;smc.drawImage(src,0,0,w,h);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(sm,0,0,w,h,0,0,w*bs,h*bs);
    const n=Math.floor(noise*w*h*.3);
    for(let i=0;i<n;i++){const v=Math.random()*255|0;ctx.fillStyle=`rgb(${v},${v},${v})`;
      ctx.fillRect(Math.floor(Math.random()*w)*bs,Math.floor(Math.random()*h)*bs,bs,bs)}
    if(noise>.2){const ty=Math.random()*H,th=6+Math.random()*30;ctx.drawImage(cv,0,ty,W,th,(Math.random()-.5)*40,ty,W,th)}
  }
  requestAnimationFrame(frame);
}
/* ---------- TV positioning ---------- */
function xform(z){
  const vw=innerWidth,vh=innerHeight;let s,tx,ty;
  if(z){s=Math.max(vw/SW,vh/SH);tx=vw/2-(SX+SW/2)*s;ty=vh/2-(SY+SH/2)*s}
  else{s=Math.min(vw*.94/TW,(vh-50)*.9/TH,1.5);tx=(vw-TW*s)/2;ty=(vh-TH*s)/2-14}
  tv.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
}
function layout(){tv.classList.remove('anim');xform(zoomed)}
addEventListener('resize',layout);

/* ---------- sequence ---------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function load(){
  if(busy||zoomed)return;busy=true;
  disc.classList.remove('pulse');hint.style.opacity=0;
  tray.classList.add('closed');await wait(1250);        // tray slides shut
  const T=2400,t0=performance.now();let swapped=false;
  setTimeout(()=>{tv.classList.add('anim');tv.classList.add('zoomed');xform(true);zoomed=true},350); // widen to full screen
  await new Promise(done=>{(function step(){
    const t=performance.now()-t0,p=t/T;
    if(p<.45){const k=p/.45;bs=Math.max(1,Math.round(1+k*k*58));noise=k*.9}
    else{if(!swapped){scene='menu';swapped=true}
      const k=(p-.45)/.55;bs=Math.max(1,Math.round(1+(1-k)*(1-k)*58));noise=Math.max(0,(1-k)*.7)}
    if(p>=1){bs=1;noise=0;done()}else requestAnimationFrame(step)})()});
  reset.classList.add('show');busy=false;
}
async function eject(){
  if(busy||!zoomed)return;busy=true;reset.classList.remove('show');
  tv.classList.add('anim');tv.classList.remove('zoomed');zoomed=false;xform(false);
  await wait(2000);scene='bounce';tray.classList.remove('closed');
  await wait(1100);disc.classList.add('pulse');hint.style.opacity=1;busy=false;
}
disc.addEventListener('click',load);
reset.addEventListener('click',eject);
addEventListener('keydown',e=>{if(e.key==='Escape')eject()});
layout();frame();
</script>
</body>
</html>
