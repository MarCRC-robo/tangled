
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Old TV + DVD</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #000;
    font-family: "Trebuchet MS", Verdana, sans-serif;
}

#tv {
    position: absolute;
    width: 760px;
    height: 660px;
    left: 0;
    top: 0;
    transform-origin: top left;
    will-change: transform;
}

#tv.anim {
    transition: transform 2s cubic-bezier(.65, 0, .25, 1);
}

.case {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: linear-gradient(
        160deg,
        #d9dcde,
        #b5b9bc 55%,
        #9da1a4
    );
    box-shadow:
        inset 0 2px 0 #ffffff88,
        inset 0 -6px 14px #0004,
        0 18px 40px #000a;
    transition: opacity .6s;
}

.border {
    position: absolute;
    left: 42px;
    top: 30px;
    width: 676px;
    height: 514px;
    border-radius: 26px;
    background: #101314;
    box-shadow:
        inset 0 0 0 3px #2a2f31,
        0 2px 0 #ffffff66;
}

.screen {
    position: absolute;
    left: 56px;
    top: 44px;
    width: 648px;
    height: 486px;
    border-radius: 34px / 28px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 30px #5da2ff33;
    transition: border-radius 1.6s;
}

.zoomed .screen {
    border-radius: 0;
}

.zoomed .case,
.zoomed .panel {
    opacity: 0;
}

.screen canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.glass {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            0deg,
            #0000 0 2px,
            #0003 2px 3px
        ),
        radial-gradient(
            ellipse at 50% 45%,
            #0000 55%,
            #0009 100%
        );
    box-shadow: inset 0 0 40px #0008;
}

.glass::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        125deg,
        #fff2 0,
        #fff0 28%
    );
}

.slot {
    position: absolute;
    background: #171a1b;
    border-radius: 4px;
    box-shadow:
        inset 0 3px 6px #000,
        0 1px 0 #fff9;
}

.vhs {
    left: 56px;
    top: 582px;
    width: 330px;
    height: 24px;
}

.vhs::after {
    content: "VHS";
    position: absolute;
    left: 10px;
    top: 5px;
    font-size: 10px;
    color: #8a9094;
    letter-spacing: 2px;
}

.dvd {
    left: 420px;
    top: 582px;
    width: 284px;
    height: 12px;
    border-radius: 3px;
    background: #080a0b;
    box-shadow:
        inset 0 3px 5px #000,
        0 1px 0 #fff5;
    z-index: 3;
}

.TV-btns {
    position: absolute;
    top: 618px;
    height: 14px;
    display: flex;
    gap: 7px;
    align-items: center;
}

.TV-btns i {
    width: 26px;
    height: 10px;
    border-radius: 2px;
    background: linear-gradient(#e9ebec, #8f9396);
    box-shadow: 0 1px 1px #0006;
}

.TV-btns b {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #2a2f31;
    box-shadow: inset 0 0 0 2px #0006;
}

.TV-btns b.led {
    background: #ff2b2b;
    box-shadow: 0 0 6px #f22;
}

.t-area {
    position: absolute;
    left: 420px;
    top: 582px;
    width: 284px;
    height: 78px;
    overflow: hidden;
    z-index: 4;
}

.tray {
    position: absolute;
    left: 10px;
    top: 0;
    width: 264px;
    height: 68px;
    border: 3px solid #777d81;
    border-top: 5px solid #4b5053;
    border-radius: 2px 2px 8px 8px;
    background: linear-gradient(
        180deg,
        #34393c,
        #171a1c 45%,
        #080a0b
    );
    box-shadow:
        0 5px 9px #0009,
        inset 0 2px 3px #ffffff22;
    transition: transform 1.1s cubic-bezier(.5, 0, .3, 1);
}

.tray.closed {
    transform: translateY(-72px);
}

.tray::before {
    content: "";
    position: absolute;
    width: 116px;
    height: 48px;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(
        ellipse,
        #080a0b 0 38%,
        #292e31 40% 44%,
        #101315 48% 100%
    );
    box-shadow: inset 0 2px 5px #000;
}

.tray::after {
    content: "";
    position: absolute;
    bottom: 2px;
    left: 8px;
    right: 8px;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(
        90deg,
        #555b5f,
        #aeb3b6,
        #555b5f
    );
}

#disc {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 190px;
    height: 127px;
    transform: translate(-50%, -50%);
    padding: 0;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    box-shadow: none;
}

#disc img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: transparent;
}


#hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 14px;
    text-align: center;
    color: #e9d9c8;
    font-size: 14px;
    transition: opacity .5s;
    pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
    #tv.anim,
    .tray {
        transition-duration: .01s;
    }

    #disc.pulse {
        animation: none;
    }
}
</style>
</head>

<body>

<div id="tv">

    <div class="case"></div>

    <div class="border"></div>

    <div class="screen">
        <canvas id="screen" width="640" height="480"></canvas>
        <div class="glass"></div>
    </div>

    <div class="slot vhs"></div>

    <div class="slot dvd"></div>

    <div class="TV-btns" style="left:56px">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <b class="led"></b>
    </div>

    <div class="TV-btns" style="left:420px">
        <b></b>
        <i></i>
        <i></i>
        <i></i>
    </div>

    <div class="t-area">
        <div class="tray" id="tray">
            <button
                id="disc"
                class="pulse"
                aria-label="Push the disc into the player">
                <img src="../images/CD (2).png" alt="DVD">
            </button>
        </div>
    </div>

</div>

<div id="hint">Click the disc to load it</div>

<script>

const tv = document.getElementById('tv');
const disc = document.getElementById('disc');
const tray = document.getElementById('tray');
const hint = document.getElementById('hint');

const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');

const W = 640;
const H = 480;

const TW = 760;
const TH = 660;

const SX = 56;
const SY = 44;
const SW = 648;
const SH = 486;

const src = document.createElement('canvas');
src.width = W;
src.height = H;
const sc = src.getContext('2d');

const sm = document.createElement('canvas');
const smc = sm.getContext('2d');

let dvdX = 100;
let dvdY = 100;

let dvdSpeedX = 3;
let dvdSpeedY = 2.5;

let dvdColor = 0;

const dvdColors = [
    '#C99BFF',
    '#FFB6D9',
    '#A9D9FF',
    '#FFE0A3',
    '#C5E9D5',
    '#D9B8FF',
    '#FFC9B5'
];

const dvdWidth = 150;
const dvdHeight = 85;

let bs = 1;
let noise = 0;

let zoomed = false;
let busy = false;

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function drawDVD() {
    sc.clearRect(0, 0, W, H);

    const gradient = sc.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, '#10102b');
    gradient.addColorStop(1, '#030311');

    sc.fillStyle = gradient;
    sc.fillRect(0, 0, W, H);

    const color = dvdColors[dvdColor];

    sc.save();

    sc.shadowColor = color;
    sc.shadowBlur = 12;
    sc.strokeStyle = color;
    sc.fillStyle = color;

    sc.lineWidth = 3;
    sc.font = 'italic bold 48px Arial';
    sc.textAlign = 'center';
    sc.textBaseline = 'middle';

    sc.fillText(
        'DVD',
        dvdX + dvdWidth / 2,
        dvdY + 27
    );

    sc.beginPath();

    sc.ellipse(
        dvdX + dvdWidth / 2,
        dvdY + 57,
        67,
        9,
        0,
        0,
        Math.PI * 2
    );

    sc.stroke();

    sc.font = 'bold 10px Arial';

    sc.fillText(
        'MARCY',
        dvdX + dvdWidth / 2,
        dvdY + 57
    );

    sc.restore();
}

function animateDVD() {

    if (!busy) {
        dvdX += dvdSpeedX;
        dvdY += dvdSpeedY;

        if (dvdX <= 0 || dvdX + dvdWidth >= W) {
            dvdX = Math.max(0, Math.min(W - dvdWidth, dvdX));
            dvdSpeedX *= -1;
            dvdColor = (dvdColor + 1) % dvdColors.length;
        }

        if (dvdY <= 0 || dvdY + dvdHeight >= H) {
            dvdY = Math.max(0, Math.min(H - dvdHeight, dvdY));
            dvdSpeedY *= -1;
            dvdColor = (dvdColor + 1) % dvdColors.length;
        }
    }

    drawDVD();

    if (bs <= 1 && noise <= 0) {
        ctx.drawImage(src, 0, 0);
    } else {
        const w = Math.max(1, Math.ceil(W / bs));
        const h = Math.max(1, Math.ceil(H / bs));

        sm.width = w;
        sm.height = h;

        smc.drawImage(src, 0, 0, w, h);

        ctx.imageSmoothingEnabled = false;

        ctx.drawImage(
            sm,
            0, 0, w, h,
            0, 0, W, H
        );

        ctx.imageSmoothingEnabled = true;

        const n = Math.floor(noise * w * h * 0.3);

        for (let i = 0; i < n; i++) {
            const v = Math.random() * 255 | 0;

            ctx.fillStyle = `rgb(${v},${v},${v})`;

            ctx.fillRect(
                Math.floor(Math.random() * w) * bs,
                Math.floor(Math.random() * h) * bs,
                bs,
                bs
            );
        }

        if (noise > 0.2) {
            const ty = Math.random() * H;
            const th = 6 + Math.random() * 30;

            ctx.drawImage(
                src,
                0, ty, W, th,
                (Math.random() - 0.5) * 40,
                ty, W, th
            );
        }
    }

    requestAnimationFrame(animateDVD);
}

function xform(z) {
    const vw = innerWidth;
    const vh = innerHeight;

    let s, tx, ty;

    if (z) {
        s = Math.max(vw / SW, vh / SH);

        tx = vw / 2 - (SX + SW / 2) * s;
        ty = vh / 2 - (SY + SH / 2) * s;
    } else {
        s = Math.min(
            vw * .94 / TW,
            (vh - 50) * .9 / TH,
            1.5
        );

        tx = (vw - TW * s) / 2;
        ty = (vh - TH * s) / 2 - 14;
    }

    tv.style.transform =
        `translate(${tx}px, ${ty}px) scale(${s})`;
}

function layout() {
    if (!zoomed) {
        tv.classList.remove('anim');
    }

    xform(zoomed);
}

window.addEventListener('resize', layout);

async function load() {
    if (busy || zoomed) return;

    busy = true;

    disc.classList.remove('pulse');
    hint.style.opacity = 0;

    tray.classList.add('closed');

    await wait(1250);

    const T = 2400;
    const t0 = performance.now();

    tv.classList.add('anim');
    tv.classList.add('zoomed');

    xform(true);
    zoomed = true;

    await new Promise(done => {

        function step() {
            const t = performance.now() - t0;
            const p = Math.min(t / T, 1);

            bs = Math.max(
                1,
                Math.round(1 + p * p * 58)
            );

            noise = p * 0.9;

            if (p >= 1) {
                done();
            } else {
                requestAnimationFrame(step);
            }
        }

        requestAnimationFrame(step);
    });

    await wait(150);

    window.location.href = 'Home.html';
}

disc.addEventListener('click', load);

layout();
animateDVD();

</script>

</body>
</html>
