

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video progress</title>


    <style>
      body {
        background-color: #FBDEFF;
      }


      .rapunzel {
        position: relative;
        float: right;
        width: 600px;
        margin-left: auto;
        margin-right: 0;
        overflow: visible;
      }


      .rapunzel img.character {
        display: block;
        width: 100%;
        height: auto;
        position: relative;
        z-index: 1;
      }


      .hair-extension {
    position: absolute;
    left: 35%;
    top: 85%;
    width: 400px;
    height: 2000px;


    background-image: url("../images/Long\ Blonde\ Hair\ Cascade.png");
    background-repeat: repeat-y;
    background-size: 100% auto;
    background-position: top center;


    /* Allow the hair to extend downwards */
    overflow: visible;
      }


      .hair-extension img {
        display: block;
        width: 100%;
        height: auto;


        /* Gradually blend the top into the original hair */
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          black 15%
        );


        mask-image: linear-gradient(
          to bottom,
          transparent, 0%,
          black 15%
        );
      }
    </style>
  </head>


  <body>
    <h1 style="color: rgb(147, 81, 0)">
      <i>Video Timeline</i>
    </h1>


    <p>


    </p>


    <div class="rapunzel">


      <img
        src="../images/raiponce.png"
        class="character"
      />


      <div class="hair-extension">
        <img src="../images/blonde hair.png" />
      </div>


    </div>


  </body>
</html>
