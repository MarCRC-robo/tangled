<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top,  #b589d6 0%,
          #9969c7 35%,
          #975ed3 50%,
          #6a359c 80%,
          #552586 100%);
      font-family: Tahoma, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #222;
      overflow-x: hidden;
    }

    /* ================= OUTER Y2K PINK LAYOUT ================= */
    .msp-window {
      width: 100%;
      max-width: 1140px;
      background: linear-gradient(180deg, #6c3299 0%, #6726ad 100%); 
      border: 3px solid #6d3ca1;
      border-radius: 16px;
      padding: 14px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.65),
        inset 0 2px 4px rgba(255, 255, 255, 0.5);
      display: grid;
      grid-template-columns: 1fr 295px;
      gap: 14px;
    }

    /* ================= LEFT GLOSSY PINK SCREEN FRAME ================= */
    .left-frame {
      background: linear-gradient(180deg,   #b589d6 0%,
          #9969c7 35%,
          #975ed3 50%,
          #6a359c 80%,
          #552586 100%);
      border-radius: 14px;
      padding: 16px;
      border: 2px solid #a564ea;
      box-shadow:
        inset 0 3px 6px rgba(255, 255, 255, 0.7),
        inset 0 -4px 8px rgba(120, 37, 168, 0.6);
      display: flex;
      flex-direction: column;
    }

    /* Main Viewport containing the 3D Carousel */
    .carousel-viewport {
      position: relative;
      width: 100%;
      height: 525px;
      border-radius: 10px;
      border: 3px solid #975ed3;
      overflow: hidden;
      background: #000000;
      box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.45);
      user-select: none;
    }


    /* "Rapunzel is better" Sassy Comment Bubble */
    .rapunzel-comment {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      z-index: 40;
      background: linear-gradient(180deg, #fff0f8 0%, #ffd1ea 100%);
      border: 2.5px solid #ff1493;
      border-radius: 20px;
      padding: 7px 18px;
      color: #9e0059;
      font-weight: 700;
      font-size: 13.5px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    .rapunzel-comment.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
      animation: popWiggle 0.4s ease;
    }

    .rapunzel-comment.approved {
      background: linear-gradient(180deg, #f3e8ff 0%, #e9d5ff 100%);
      border-color: #9333ea;
      color: #581c87;
    }

    .back-rapunzel-btn {
      background: #5417c6;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .back-rapunzel-btn:hover {
      transform: scale(1.06);
      background: #5417c6;
    }

    @keyframes popWiggle {
      0% { transform: translateX(-50%) scale(0.8); }
      45% { transform: translateX(-50%) scale(1.07) rotate(-1.5deg); }
      75% { transform: translateX(-50%) scale(0.98) rotate(1deg); }
      100% { transform: translateX(-50%) scale(1) rotate(0deg); }
    }

    /* ================= 3-CARD OVERLAPPING 3D CAROUSEL (NO BORDER / NO CASE) ================= */
    .stage-3d {
      position: absolute;
      top: 95px;
      left: 0;
      right: 0;
      height: 290px;
      perspective: 950px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-track {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .carousel-card {
      position: absolute;
      top: 50%;
      left: 50%;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      cursor: pointer;
      transition:
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.35s ease,
        filter 0.35s ease,
        box-shadow 0.35s ease;
    }

    .carousel-card.is-center {
      border: none;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.88);
    }

    .carousel-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Active Title Under Center Card */
    .center-reflection-box {
      position: absolute;
      top: 405px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      width: 340px;
    }

    .reflection-title {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 32px;
      letter-spacing: 1.5px;
      color: #ffd84d;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
      line-height: 1.1;
    }

    /* Left & Right Arrow Buttons */
    .nav-arrow {
      position: absolute;
      top: 46%;
      transform: translateY(-50%);
      z-index: 35;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      background: linear-gradient(180deg, rgba(149, 73, 203, 0.92) 0%, rgba(85, 26, 167, 0.95) 100%);
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
      transition: transform 0.15s, background 0.15s;
    }

    .nav-arrow:hover {
      transform: translateY(-50%) scale(1.12);
      background: linear-gradient(180deg, #ff85c2 0%, #db2777 100%);
    }

    .nav-arrow:active {
      transform: translateY(-50%) scale(0.96);
    }

    .nav-arrow.prev { left: 16px; }
    .nav-arrow.next { right: 16px; }

    /* ================= RIGHT SIDEBAR (VERTICAL POSTER CARD) ================= */
    .right-sidebar {
      display: flex;
      flex-direction: column;
    }

    /* Vertical Minimalist Movie Poster Card */
    .poster-card {
      background: #e6e5e0;
      border: 1px solid #cfcec8;
      border-radius: 6px;
      padding: 16px 16px 20px 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .poster-art {
      width: 100%;
      aspect-ratio: 1 / 1.12;
      background: #182238;
      overflow: hidden;
      border: 1px solid #c7c6c1;
    }

    .poster-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .poster-details {
      margin-top: 14px;
      color: #18181b;
    }

    .poster-title-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .poster-movie-title {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 28px;
      line-height: 1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #141414;
    }

    .poster-movie-year {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #27272a;
    }

    .credits-grid {
      display: grid;
      grid-template-columns: 64px 1fr;
      row-gap: 4px;
      column-gap: 6px;
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      line-height: 1.25;
      letter-spacing: 0.3px;
    }

    .credit-label {
      color: #52525b;
      text-transform: lowercase;
      font-weight: 400;
    }

    .credit-value {
      color: #18181b;
      text-transform: uppercase;
      font-weight: 600;
    }

    .credits-cast-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 64px 1fr;
      column-gap: 6px;
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      line-height: 1.25;
    }

    @media (max-width: 880px) {
      .msp-window {
        grid-template-columns: 1fr;
      }
      .carousel-viewport {
        height: 460px;
      }
    }
  </style>
</head>
<body>

  <div class="msp-window">
    <!-- LEFT: GLOSSY PINK FRAME + 3-CARD CAROUSEL INSIDE -->
    <div class="left-frame">
      <div class="carousel-viewport" id="carouselViewport">
        <div class="sky-clouds"></div>

        <!-- "Rapunzel is better" Sassy Comment Banner -->
        <div class="rapunzel-comment" id="rapunzelComment">
          <span id="commentText">💬 Rapunzel is better!! 👑✨</span>
          <button class="back-rapunzel-btn" id="backRapunzelBtn" title="Switch back to Tangled">
            Back to Rapunzel
          </button>
        </div>

        <!-- Left / Right Arrow Buttons -->
        <button class="nav-arrow prev" id="prevBtn" aria-label="Previous movie">❮</button>
        <button class="nav-arrow next" id="nextBtn" aria-label="Next movie">❯</button>

        <!-- 3-Card Overlapping 3D Carousel Track -->
        <div class="stage-3d">
          <div class="carousel-track" id="carouselTrack"></div>
        </div>

        <!-- Active Movie Title -->
        <div class="center-reflection-box">
          <div class="reflection-title" id="reflectionTitle">TANGLED</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: VERTICAL MOVIE POSTER INFO CARD -->
    <div class="right-sidebar">
      <div class="poster-card" id="posterCard">
        <div class="poster-art">
          <img id="posterImg" src="Tangled.jpg" alt="Tangled poster" />
        </div>

        <div class="poster-details">
          <div class="poster-title-row">
            <span class="poster-movie-title" id="posterTitle">TANGLED</span>
            <span class="poster-movie-year" id="posterYear">2010</span>
          </div>

          <div class="credits-grid">
            <span class="credit-label">running time</span>
            <span class="credit-value" id="posterRuntime">100 MINUTES</span>

            <span class="credit-label">directed by</span>
            <span class="credit-value" id="posterDirector">NATHAN GRENO    BYRON HOWARD</span>

            <span class="credit-label">produced by</span>
            <span class="credit-value" id="posterProducer">ROY CONLI</span>
          </div>

          <div class="credits-cast-row">
            <span class="credit-label">starring</span>
            <span class="credit-value" id="posterCast">MANDY MOORE    ZACHARY LEVI    DONNA MURPHY</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       6 FILM OPTIONS (Default: Tangled / Rapunzel)
    ========================================================================= */
    const MOVIES = [
      {
        id: "tangled",
        title: "TANGLED",
        year: "2010",
        runtime: "100 MINUTES",
        director: "NATHAN GRENO   BYRON HOWARD",
        producer: "ROY CONLI",
        cast: "MANDY MOORE   ZACHARY LEVI   DONNA MURPHY",
        image: "../images/Tangled.jpg"
      },
      {
        id: "zootopia",
        title: "ZOOTOPIA",
        year: "2016",
        runtime: "108 MINUTES",
        director: "BYRON HOWARD   RICH MOORE",
        producer: "CLARK SPENCER",
        cast: "GINNIFER GOODWIN   JASON BATEMAN   IDRIS ELBA",
        image: "../images/zootopia.jpg"
      },
      {
        id: "frozen",
        title: "FROZEN",
        year: "2013",
        runtime: "102 MINUTES",
        director: "CHRIS BUCK   JENNIFER LEE",
        producer: "PETER DEL VECHO",
        cast: "KRISTEN BELL   IDINA MENZEL   JOSH GAD",
        image: "../images/Frozen.jpg"
      },
      {
        id: "nemo",
        title: "FINDING NEMO",
        year: "2003",
        runtime: "100 MINUTES",
        director: "ANDREW STANTON",
        producer: "GRAHAM WALTERS",
        cast: "ALBERT BROOKS   ELLEN DEGENERES   ALEXANDER GOULD",
        image: "../images/Nemo.jpg"
      },
      {
        id: "insideout",
        title: "INSIDE OUT",
        year: "2015",
        runtime: "95 MINUTES",
        director: "PETE DOCTER",
        producer: "JONAS RIVERA",
        cast: "AMY POEHLER   PHYLLIS SMITH   BILL HADER",
        image: "../images/Inside Out.jpg"
      },
      {
        id: "soul",
        title: "SOUL",
        year: "2020",
        runtime: "100 MINUTES",
        director: "PETE DOCTER",
        producer: "DANA MURRAY",
        cast: "JAMIE FOXX   TINA FEY   GRAHAM NORTON",
        image: "../images/soul.jpg"
      }
    ];

    /* =========================================================================
       STATE & DOM REFERENCES
    ========================================================================= */
    let currentIndex = 0; // 0 = Tangled (Rapunzel) by default

    const track = document.getElementById("carouselTrack");
    const commentBox = document.getElementById("rapunzelComment");
    const commentText = document.getElementById("commentText");
    const backRapunzelBtn = document.getElementById("backRapunzelBtn");

    const reflectionTitle = document.getElementById("reflectionTitle");

    const posterImg = document.getElementById("posterImg");
    const posterTitle = document.getElementById("posterTitle");
    const posterYear = document.getElementById("posterYear");
    const posterRuntime = document.getElementById("posterRuntime");
    const posterDirector = document.getElementById("posterDirector");
    const posterProducer = document.getElementById("posterProducer");
    const posterCast = document.getElementById("posterCast");

    /* =========================================================================
       BUILD & POSITION 3-CARD OVERLAPPING CAROUSEL (6 FILMS TOTAL)
    ========================================================================= */
    function initCarousel() {
      track.innerHTML = "";
      MOVIES.forEach((movie, idx) => {
        const card = document.createElement("div");
        card.className = "carousel-card";

        const img = document.createElement("img");
        img.src = movie.image;
        img.alt = movie.title;

        card.appendChild(img);
        card.addEventListener("click", () => {
          currentIndex = idx;
          renderCarousel(true);
        });
        track.appendChild(card);
      });
      renderCarousel(false);
    }

    function renderCarousel(userInteracted) {
      const cards = track.querySelectorAll(".carousel-card");
      const total = MOVIES.length; // 6 films

      cards.forEach((card, idx) => {
        // Circular offset in range [-2, 3]
        let offset = idx - currentIndex;
        if (offset > Math.floor(total / 2)) offset -= total;
        if (offset < -Math.floor(total / 2)) offset += total;

        const prevOffset = card.dataset.prevOffset !== undefined
          ? Number(card.dataset.prevOffset)
          : offset;

        // Disable transition only when a hidden card wraps across the back (-2 <-> +3)
        const wrappedInBack = Math.abs(offset - prevOffset) > 2;
        card.style.transition = wrappedInBack ? "none" : "";
        card.dataset.prevOffset = offset;

        card.classList.toggle("is-center", offset === 0);

        if (offset === 0) {
          // MIDDLE CARD: Pops forward and overlaps the left & right cards
          card.style.width = "215px";
          card.style.height = "265px";
          card.style.zIndex = 30;
          card.style.opacity = 1;
          card.style.filter = "brightness(1.05)";
          card.style.pointerEvents = "auto";
          card.style.transform =
            "translate(-50%, -50%) translateX(0px) translateZ(75px) rotateY(0deg)";
        } else if (offset === -1) {
          // LEFT VISIBLE CARD: Partially tucked behind the middle card
          card.style.width = "148px";
          card.style.height = "185px";
          card.style.zIndex = 15;
          card.style.opacity = 1;
          card.style.filter = "brightness(0.82)";
          card.style.pointerEvents = "auto";
          card.style.transform =
            "translate(-50%, -50%) translateX(-136px) translateZ(-20px) rotateY(16deg)";
        } else if (offset === 1) {
          // RIGHT VISIBLE CARD: Partially tucked behind the middle card
          card.style.width = "148px";
          card.style.height = "185px";
          card.style.zIndex = 15;
          card.style.opacity = 1;
          card.style.filter = "brightness(0.82)";
          card.style.pointerEvents = "auto";
          card.style.transform =
            "translate(-50%, -50%) translateX(136px) translateZ(-20px) rotateY(-16deg)";
        } else {
          // OTHER 3 CARDS: Hidden off to the left or right edge
          const dir = offset < 0 ? -1 : 1;
          card.style.width = "120px";
          card.style.height = "150px";
          card.style.zIndex = 1;
          card.style.opacity = 0;
          card.style.filter = "brightness(0.6)";
          card.style.pointerEvents = "none";
          card.style.transform =
            `translate(-50%, -50%) translateX(${dir * 245}px) translateZ(-80px) rotateY(${dir * -28}deg)`;
        }
      });

      updateSidebarAndComment(userInteracted);
    }

    function updateSidebarAndComment(userInteracted) {
      const activeMovie = MOVIES[currentIndex];

      // 1. Update Active Title & Right-Side Poster Info Card
      reflectionTitle.textContent = activeMovie.title;

      posterImg.src = activeMovie.image;
      posterImg.alt = `${activeMovie.title} poster`;

      posterTitle.textContent = activeMovie.title;
      posterYear.textContent = activeMovie.year;
      posterRuntime.textContent = activeMovie.runtime;
      posterDirector.textContent = activeMovie.director;
      posterProducer.textContent = activeMovie.producer;
      posterCast.textContent = activeMovie.cast;

      // 2. Rapunzel Rule: Switching away from Tangled shows "Rapunzel is better"
      if (activeMovie.id !== "tangled") {
        commentBox.classList.remove("approved");
        commentText.textContent = `💬 Rapunzel is better!! (than ${activeMovie.title} 👑)`;
        backRapunzelBtn.style.display = "inline-block";
        commentBox.classList.remove("show");
        void commentBox.offsetWidth;
        commentBox.classList.add("show");
      } else {
        if (userInteracted) {
          commentBox.classList.add("approved");
          commentText.textContent = `💖 Taste! Rapunzel is the best!`;
          backRapunzelBtn.style.display = "none";
          commentBox.classList.remove("show");
          void commentBox.offsetWidth;
          commentBox.classList.add("show");
        } else {
          commentBox.classList.remove("show");
        }
      }
    }

    function cycleMovie(step) {
      currentIndex = (currentIndex + step + MOVIES.length) % MOVIES.length;
      renderCarousel(true);
    }

    function selectById(id) {
      const found = MOVIES.findIndex(m => m.id === id);
      if (found !== -1) {
        currentIndex = found;
        renderCarousel(true);
      }
    }

    /* =========================================================================
       EVENT LISTENERS (Buttons + Keyboard Left/Right Arrow Keys)
    ========================================================================= */
    document.getElementById("prevBtn").addEventListener("click", () => cycleMovie(-1));
    document.getElementById("nextBtn").addEventListener("click", () => cycleMovie(1));
    backRapunzelBtn.addEventListener("click", () => selectById("tangled"));

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        cycleMovie(-1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        cycleMovie(1);
      }
    });

    // Start app with Rapunzel (Tangled) selected by default
    initCarousel();
  </script>
</body>
</html>
