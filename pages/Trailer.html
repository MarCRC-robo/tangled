<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcy let down your hair</title>
    <style>
      * {
        box-sizing: border-;
        user-select: none;
      }
      body {
        margin: 0;
        padding-top: 60px;
        background-color: #fdfdfd;
        min-height: 100vh;
        overflow: hidden;
      }

      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: #d8bddb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 80px 0 20px;
        box-sizing: border-box;
        z-index: 1000;
      }

      .links a:hover {
        font-weight: bold;
      }

      .logo {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .logo img {
        width: 40px;
        height: auto;
        display: block;
      }

      .links {
        display: flex;
        align-items: center;
        margin-left: 20px;
        margin-right: auto;
      }

      .links a {
        color: #eae85d;
        text-decoration: none;
        margin-right: 20px;
        font-family: Arial, sans-serif;
        font-weight: 500;
        white-space: nowrap;
      }

      .lang-btn {
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 5px 12px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <a class="logo" id="homeLogo" href="#">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>

      <div class="links">
        <a href="#" id="homeLink" data-en="Home" data-fr="Accueil">Home</a>
        <a href="index.html" data-en="TV" data-fr="TV">TV</a>
        <a href="Home.html" data-en="Home" data-fr="Accueil">Home</a>
        <a href="Cast.html" data-en="Cast" data-fr="Casting">Cast</a>
        <a href="Settings.html" data-en="Robot" data-fr="Robot">Settings</a>
        <a href="Blog.html" data-en="Blog" data-fr="Blog">Blog</a>
        <a href="Arcade.html" data-en="Arcade" data-fr="Arcade">Arcade</a>
        <a href="Credits.html" data-en="Credits" data-fr="Crédits">Credits</a>
        <a href="Trailer.html" data-en="Trailer" data-fr="Bande-annonce"
          >Trailer</a
        >
      </div>

      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>
    </div>

    <script>
      let currentLang = "en";

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";
        document.documentElement.lang = currentLang;

        const elementsToTranslate = document.querySelectorAll("[data-en]");
        elementsToTranslate.forEach((element) => {
          element.innerText = element.getAttribute(`data-${currentLang}`);
        });
      }
    </script>
  </body>
</html>
