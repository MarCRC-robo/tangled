<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiosk progress</title>
  </head>
  <style>
    body {
      margin: 0;
      padding-top: 60px;
      background-color: #dad865;
    }

    .bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #d8bddb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 80px 0 20px; /* Right padding leaves space for sliding logo */
      box-sizing: border-box;
      z-index: 1000;
      transform-origin: left center;
      transition:
        transform 0.6s ease-in-out,
        opacity 0.6s ease-in-out;
    }

    .links a:hover {
      font-weight: bold;
    }

    .logo {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .logo img {
      width: 40px; /* Reduced slightly to fit neatly inside 60px bar height */
      height: auto;
      display: block;
    }

    .links {
      display: flex;
      align-items: center;
      margin-left: 20px; /* Adds space between logo and first link */
      margin-right: auto; /* Pushes the language button to the far right */
    }

    .links a {
      color: #eae85d;
      text-decoration: none;
      margin-right: 20px; /* Keeps consistent spacing between links */
      font-family: Arial, sans-serif;
      font-weight: 500;
      white-space: nowrap;
    }

    .lang-btn {
      background-color: transparent;
      color: #eae85d;
      border: 2px solid #eae85d;
      border-radius: 5px;
      padding: 5px 12px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      background-color: #eae85d;
      color: #1a0f23;
    }
  </style>
  <body style="background-color: rgb(241, 170, 243)">
    <h1 style="color: rgb(147, 81, 0)"><i>3D Timeline</i></h1>

    <p>summer break</p>

    <!-- Keeps head & hair locked together -->
    <div style="position: relative; float: right; margin-right: 50px">
      <img
        src="../images/rapunzel-2.png"
        style="display: block; width: 600px; height: auto"
      />
      <div
        style="
          position: absolute;
          left: 49%;
          top: 100%;
          width: 300px;
          height: 1500px;
          background-image: url(../images/cheuveux.png);
          background-repeat: repeat-y;
          background-size: contain;
        "
      ></div>
    </div>

    <div class="bar">
      <!-- Place logo first -->
      <a class="logo" href="Home.html">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>

      <!-- Navigation Links -->
      <div class="links">
        <a href="Home.html" data-en="Home" data-fr="Accueil">Home</a>
        <a href="Robot.html" data-en="Robot" data-fr="Robot">Robot</a>
        <a href="Arcade.html" data-en="Arcade" data-fr="Arcade">Arcade</a>
        <a href="Timeline.html" data-en="Timeline" data-fr="Chronologie"
          >Timeline</a
        >
        <a href="Sponsors.html" data-en="Sponsors" data-fr="Commanditaires"
          >Sponsors</a
        >
        <a href="Team.html" data-en="Team" data-fr="Équipe">Team</a>
      </div>

      <!-- Language Button -->
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>
    </div>
    <script>
      let currentLang = "en";

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";
        document.documentElement.lang = currentLang;

        const elementsToTranslate = document.querySelectorAll("[data-en]");
        elementsToTranslate.forEach((element) => {
          element.innerText = element.getAttribute(`data-${currentLang}`);
        });
      }
    </script>
  </body>
</html>
