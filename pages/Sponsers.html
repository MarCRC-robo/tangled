<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Sponsors</title>




  <style>
    /* 1. Page Background & Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html, body {
      width: 100%;
      height: 100%;
     
    }
   


    body {
      margin: 0;
      padding-top: 60px;
      background-image: url('../images/cred.png');
      background-size: 115%;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }


    /* 2. Side Containers for Cubes */
    .cube-track {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 80px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
      contain: paint;
    }


    .cube-track.left {
      left: 20px;
    }


    .cube-track.right {
      right: 20px;
    }


    /* Continuous upward animation loop */
   .cube-column {
  display: flex;
  flex-direction: column;
  gap: 35px;
  animation: loopUp 12s linear infinite;
  will-change: transform;
}


    @keyframes loopUp {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-50%);
      }
    }


    /* 3. Cube Visual Styling */
    .cube {
  width: 25px;
  height: 25px;
  margin: 0 auto;
  background-color: #000000c3;;
  border-radius: 2px;
  flex-shrink: 0;
}


    /* 4. Center Credits Text Container */
.credits-container {
    width: 100%;
    max-width: 850px;
    padding: 0px 0px;
    text-align: center;
    z-index: 5;
}


.title {
 font-family: 'Cinzel', serif;
  font-size: 3rem;
  letter-spacing: 5px;
  color: #b88635;
  margin-bottom: 20px;
}


.role {
font-family: 'Cinzel', serif;
  font-size: 1.5rem;
  font-style: italic;
  color: #b88635;
  letter-spacing: 3px;
  margin-bottom: 25px;
}
.names {
  font-family: "Times New Roman", serif;
  font-size: 1.15rem;
  font-weight: 400;
  letter-spacing: 1.5px;
  line-height: 1.8;
  color: #655533;
  margin-bottom: 8px;
  transition: 0.3s;
}


.sponsors-list {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}


.sponsors-list .names {
  width: 100%;
  padding: 8px 0;
  border-bottom: 1px solid rgba(184, 134, 53, 0.3);
}


.sponsors-list .names:last-child {
  border-bottom: none;
}
.sponsors-container {
    display: flex;
    justify-content: center;
    width: 100%;
    margin: 20px auto;
}


.sponsors-image {
    width: 100%;
    max-width: 650px;
    height: auto;
    display: block;
    mix-blend-mode: multiply;
}
  </style>
</head>
<body>


  <!-- LEFT CUBES -->
  <div class="cube-track left">
    <div class="cube-column">
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>    
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
    </div>
  </div>


  <!-- RIGHT CUBES -->
  <div class="cube-track right">
    <div class="cube-column">
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
      <div class="cube"></div>
    </div>
  </div>


  <!-- CENTER CREDITS -->
  <div class="credits-container">


<div class="sponsors-container">
    <img src="../images/full_credits_sponsors_same_ink.png"
         alt="Sponsors"
         class="sponsors-image">
</div>


</body>
</html>
