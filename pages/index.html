<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcy let down your hair</title>
    <style>
      * {
        box-sizing: border-;
        user-select: none;
      }
      body {
        margin: 0;
        padding-top: 60px;
        background-color: #fdfdfd;
        min-height: 100vh;
        overflow: hidden;
      }

      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: #d8bddb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 80px 0 20px;
        box-sizing: border-box;
        z-index: 1000;
        margin: 0 auto;
        padding: 8px;
        gap: 6px;
        background: linear-gradient(
          180deg,
          #b589d6 0%,
          #9969c7 35%,
          #975ed3 50%,
          #6a359c 80%,
          #552586 100%
        );
      }

      .logo {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .logo img {
        width: 40px;
        height: auto;
        display: block;
      }

      .lang-btn {
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 5px 12px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }

      .button {
        background-color: #eae85d;
        display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      text-decoration: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      border-radius: 6px;
      background: linear-gradient(
        180deg, 
        #ffaee2 0%, 
        #f24bb7 42%, 
        #aa065f 49%, 
        #ca137a 50%, 
        #6e0037 100%
      );
      transition: transform 0.1s ease, filter 0.15s ease;
      user-select: none;
      white-space: nowrap;
      }

    </style>
  </head>
  <body>
    <div class="bar">
      <a class="logo" id="homeLogo" href="#">
        <img src="../images/logo sun.png" alt="sun logo" /> </a>
        <a href="index.html" class="button" data-en="TV" data-fr="TV">TV</a>
        <a href="Home.html" class="button" data-en="Home" data-fr="Accueil"
          >Home</a
        >
        <a href="Cast.html" class="button" data-en="Cast" data-fr="Casting"
          >Cast</a
        >
        <a href="Settings.html" class="button" data-en="Robot" data-fr="Robot"
          >Settings</a
        >
        <a href="Blog.html" class="button" data-en="Blog" data-fr="Blog"
          >Blog</a
        >
        <a href="Arcade.html" class="button" data-en="Arcade" data-fr="Arcade"
          >Arcade</a
        >
        <a
          href="Credits.html"
          class="button"
          data-en="Credits"
          data-fr="Crédits"
          >Credits</a
        >
        <a
          href="Trailer.html"
          class="button"
          data-en="Trailer"
          data-fr="Bande-annonce"
          >Trailer</a
        >
      </div>
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>
    </div>
    <script>
      let currentLang = "en";

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";

        // Update button text
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";

        // Update html lang attribute
        document.documentElement.lang = currentLang;

        // Update all elements with data attributes
        const elementsToTranslate = document.querySelectorAll("[data-en]");
        elementsToTranslate.forEach((element) => {
          element.innerText = element.getAttribute(`data-${currentLang}`);
        });
      }
    </script>
  </body>
</html>
