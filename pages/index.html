<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcy let down your hair</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding-top: 60px;
        background-color: #fdfdfd;
        min-height: 100vh;
      }

      /* NAVIGATION BAR BASE STYLES */
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        z-index: 1000;
        display: flex;
        border-bottom: 3px solid #552586;
        background: linear-gradient(
          180deg,
          #b589d6 0%,
          #9969c7 35%,
          #975ed3 50%,
          #6a359c 80%,
          #552586 100%
        );
      }

      .logo {
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      .logo img {
        width: 36px;
        height: auto;
        display: block;
      }

      .hamburger {
        display: none; /* Hidden on desktop */
        background: transparent;
        border: none;
        cursor: pointer;
        flex-direction: column;
        justify-content: space-between;
        width: 28px;
        height: 20px;
        padding: 0;
      }

      .hamburger span {
        display: block;
        width: 100%;
        height: 3px;
        background-color: #eae85d;
        border-radius: 3px;
      }

      .lang-btn {
        flex-shrink: 0;
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 4px 10px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }

      .nav-links {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        flex: 1;
      }

      .button {
        flex: 1;
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 8px;
        color: #ffffff;
        text-decoration: none;
        font-family: "Trebuchet MS", Arial, sans-serif;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(80, 0, 50, 0.6);
        border: 1px solid #552586;
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        background: linear-gradient(
          180deg,
          #6c3299 0%,
          #9969c7 35%,
          #6726ad 50%,
          #3a076a 80%,
          #552586 100%
        );
        transition: filter 0.15s ease;
      }

      .button:hover {
        filter: brightness(1.15);
      }

      .button[aria-current="page"] {
        height: 44px;
        margin-bottom: -3px;
        background: linear-gradient(
          180deg,
          #b773ff 0%,
          #913bed 20%,
          #7d2fd1 50%,
          #6726ad 72%,
          #551c92 90%,
          #350d60 100%
        );
      }

      /* DESKTOP LAYOUT (769px and wider) */
      @media (min-width: 769px) {
        .bar {
          align-items: flex-end;
          padding: 0 10px;
          gap: 6px;
        }
        .logo {
          align-self: center;
          margin-right: 4px;
        }
        .lang-btn {
          align-self: center;
          margin-left: 4px;
        }
      }

      /* MOBILE LAYOUT (768px and smaller) */
      @media (max-width: 768px) {
        .bar {
          align-items: center;
          justify-content: space-between;
          padding: 0 16px;
        }

        .hamburger {
          display: flex; /* Show 3 lines button */
        }

        .nav-controls {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .nav-links {
          display: none; /* Hide desktop tab bar */
          position: fixed;
          top: 60px;
          left: 0;
          width: 100%;
          background: #552586;
          border-bottom: 3px solid #3a076a;
          padding: 10px 8px;
          overflow-x: auto;
          scrollbar-width: none;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .nav-links.active {
          display: flex; /* Show row of links when hamburger clicked */
        }

        .button {
          min-width: 90px;
          border-radius: 8px;
          border-bottom: 1px solid #7d2fd1;
        }

        .button[aria-current="page"] {
          height: 38px;
          margin-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <nav class="bar">
      <a class="logo" id="homeLogo" href="index.html">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>

      <!-- LINK BUTTONS -->
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="button" data-en="TV" data-fr="TV">TV</a>
        <a href="Home.html" class="button" data-en="Home" data-fr="Accueil">Home</a>
        <a href="Cast.html" class="button" data-en="Cast" data-fr="Casting">Cast</a>
        <a href="Settings.html" class="button" data-en="Settings" data-fr="Paramètres">Settings</a>
        <a href="Blog.html" class="button" data-en="Blog" data-fr="Blog">Blog</a>
        <a href="Arcade.html" class="button" data-en="Arcade" data-fr="Arcade">Arcade</a>
        <a href="Credits.html" class="button" data-en="Credits" data-fr="Crédits">Credits</a>
        <a href="Trailer.html" class="button" data-en="Trailer" data-fr="Bande-annonce">Trailer</a>
      </div>

      <!-- CONTROLS FOR MOBILE -->
      <div class="nav-controls">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">FR</button>
        <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>

    <script>
      let currentLang = "en";

      function toggleMenu() {
        document.getElementById("navLinks").classList.toggle("active");
      }

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";
        document.documentElement.lang = currentLang;

        document.querySelectorAll("[data-en]").forEach((el) => {
          el.innerText = el.getAttribute(`data-${currentLang}`);
        });
      }

      const here = location.pathname.split("/").pop() || "index.html";
      document.querySelectorAll(".button").forEach((a) => {
        if (a.getAttribute("href") === here) {
          a.setAttribute("aria-current", "page");
        }
      });
    </script>
  </body>
</html>
