<html lang="en">
<head>
<meta charset="UTF-8">

<title>Marcy let down your hair</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #000;
    font-family: "Trebuchet MS", Verdana, sans-serif;
}

/* NAVIGATION BAR */

.bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 3px solid #552586;
    background: linear-gradient(
        180deg,
        #b589d6 0%,
        #9969c7 35%,
        #975ed3 50%,
        #6a359c 80%,
        #552586 100%
    );
}

.logo {
    display: flex;
    align-items: center;
    cursor: pointer;
}

.logo img {
    width: 36px;
    height: auto;
    display: block;
}

.desktop-links {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 100%;
    flex: 1;
    margin: 0 12px;
}

.button {
    flex: 1;
    min-width: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 38px;
    padding: 0 8px;
    color: #fff;
    text-decoration: none;
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .5px;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(80, 0, 50, .6);
    border: 1px solid #552586;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    background: linear-gradient(
        180deg,
        #6c3299 0%,
        #9969c7 35%,
        #6726ad 50%,
        #3a076a 80%,
        #552586 100%
    );
    transition: filter .15s ease;
}

.button:hover {
    filter: brightness(1.15);
}

.button[aria-current="page"] {
    height: 44px;
    margin-bottom: -3px;
    background: linear-gradient(
        180deg,
        #b773ff 0%,
        #913bed 20%,
        #7d2fd1 50%,
        #6726ad 72%,
        #551c92 90%,
        #350d60 100%
    );
}

.dropdown {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: flex-end;
}

.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 120px;
    background: linear-gradient(180deg, #6a359c, #552586);
    border: 1px solid #552586;
    border-top: none;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, .3);
    overflow: hidden;
    z-index: 1100;
}

.dropdown-content a {
    display: block;
    padding: 14px 20px;
    color: #fff;
    text-decoration: none;
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .5px;
    text-transform: uppercase;
    white-space: nowrap;
}

.dropdown-content a:hover {
    background-color: #3a076a;
    color: #eae85d;
}

.dropdown:hover .dropdown-content {
    display: block;
}

.nav-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.lang-btn {
    background: transparent;
    color: #eae85d;
    border: 2px solid #eae85d;
    border-radius: 5px;
    padding: 4px 10px;

}

.lang-btn:hover {

}

.options span {

}

.mobile-overlay.active {

.close-btn {

/* TV */

#tv {
    position: absolute;
    width: 760px;
    height: 660px;
    left: 0;
    top: 0;
    transform-origin: top left;
    will-change: transform;
    z-index: 1;
}

#tv.anim {
    transition: transform 2s cubic-bezier(.65, 0, .25, 1);
}

.case {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: linear-gradient(
        160deg,
        #d9dcde,
        #b5b9bc 55%,
        #9da1a4
    );
    box-shadow:
        inset 0 2px 0 #ffffff88,
        inset 0 -6px 14px #0004,
        0 18px 40px #000a;
    transition: opacity .6s;
}

.border {
    position: absolute;
    left: 42px;
    top: 30px;
    width: 676px;
    height: 514px;
    border-radius: 26px;
    background: #101314;
    box-shadow:

        0 2px 0 #ffffff66;

.screen {
    position: absolute;
    left: 56px;

    width: 648px;
    height: 486px;
    border-radius: 34px / 28px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 30px #5da2ff33;
    transition: border-radius 1.6s;
}

.zoomed .screen {

}

.zoomed .case,

.screen canvas {

.glass {

    background:

.glass::after {

.tray::before {

#hint {

    bottom: 14px;

@media (max-width: 768px) {

@media (prefers-reduced-motion: reduce) {
    #tv.anim,
    .tray {
        transition-duration: .01s;
    }
}

<script>

/* lag functions */

let currentLang = "en";

function openMenu() {
    document.getElementById("mobileOverlay").classList.add("active");
}

function closeMenu() {
    document.getElementById("mobileOverlay").classList.remove("active");
}

function toggleLanguage() {
    currentLang = currentLang === "en" ? "fr" : "en";

    document.getElementById("langBtn").innerText =
        currentLang === "en" ? "FR" : "EN";

    document.documentElement.lang = currentLang;

    document.querySelectorAll("[data-en]").forEach(el => {
        el.innerText = el.getAttribute(`data-${currentLang}`);
    });
}

const currentPage = location.pathname.split("/").pop() || "index.html";

document.querySelectorAll(".button, .mobile-link").forEach(link => {
    if (link.getAttribute("href") === currentPage) {
        link.setAttribute("aria-current", "page");
    }
});



/* TV AND DVD ANIMATION */

const tv = document.getElementById("tv");
const disc = document.getElementById("disc");
const tray = document.getElementById("tray");
const hint = document.getElementById("hint");

const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");

const W = 640;
const H = 480;

const TW = 760;
const TH = 660;

const SX = 56;
const SY = 44;
const SW = 648;
const SH = 486;

const NAV_HEIGHT = 60;

const src = document.createElement("canvas");
src.width = W;
src.height = H;
const sc = src.getContext("2d");

const sm = document.createElement("canvas");
const smc = sm.getContext("2d");

let dvdX = 100;
let dvdY = 100;

let dvdSpeedX = 3;
let dvdSpeedY = 2.5;

let dvdColor = 0;

const dvdColors = [
    "#C99BFF",
    "#FFB6D9",
    "#A9D9FF",
    "#FFE0A3",
    "#C5E9D5",
    "#D9B8FF",
    "#FFC9B5"
];

const dvdWidth = 150;
const dvdHeight = 85;

let bs = 1;
let noise = 0;

let zoomed = false;
let busy = false;

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function drawDVD() {
    sc.clearRect(0, 0, W, H);

    const gradient = sc.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#10102b");
    gradient.addColorStop(1, "#030311");

    sc.fillStyle = gradient;
    sc.fillRect(0, 0, W, H);

    const color = dvdColors[dvdColor];

    sc.save();

    sc.shadowColor = color;
    sc.shadowBlur = 12;
    sc.strokeStyle = color;
    sc.fillStyle = color;

    sc.lineWidth = 3;
    sc.font = "italic bold 48px Arial";
    sc.textAlign = "center";
    sc.textBaseline = "middle";

    sc.fillText(
        "DVD",
        dvdX + dvdWidth / 2,
        dvdY + 27
    );

    sc.beginPath();

    sc.ellipse(
        dvdX + dvdWidth / 2,
        dvdY + 57,
        67,
        9,
        0,
        0,
        Math.PI * 2
    );

    sc.stroke();

    sc.font = "bold 10px Arial";

    sc.fillText(
        "MARCY",
        dvdX + dvdWidth / 2,
        dvdY + 57
    );

    sc.restore();
}

function animateDVD() {
    if (!busy) {
        dvdX += dvdSpeedX;
        dvdY += dvdSpeedY;

        if (dvdX <= 0 || dvdX + dvdWidth >= W) {
            dvdX = Math.max(0, Math.min(W - dvdWidth, dvdX));
            dvdSpeedX *= -1;
            dvdColor = (dvdColor + 1) % dvdColors.length;
        }

        if (dvdY <= 0 || dvdY + dvdHeight >= H) {
            dvdY = Math.max(0, Math.min(H - dvdHeight, dvdY));
            dvdSpeedY *= -1;
            dvdColor = (dvdColor + 1) % dvdColors.length;
        }
    }

    drawDVD();

    if (bs <= 1 && noise <= 0) {
        ctx.drawImage(src, 0, 0);
    } else {
        const w = Math.max(1, Math.ceil(W / bs));
        const h = Math.max(1, Math.ceil(H / bs));

        sm.width = w;
        sm.height = h;

        smc.drawImage(src, 0, 0, w, h);

        ctx.imageSmoothingEnabled = false;

        ctx.drawImage(
            sm,
            0, 0, w, h,
            0, 0, W, H
        );

        ctx.imageSmoothingEnabled = true;

        const n = Math.floor(noise * w * h * .3);

        for (let i = 0; i < n; i++) {
            const v = Math.random() * 255 | 0;

            ctx.fillStyle = `rgb(${v},${v},${v})`;

            ctx.fillRect(
                Math.floor(Math.random() * w) * bs,
                Math.floor(Math.random() * h) * bs,
                bs,
                bs
            );
        }

        if (noise > .2) {
            const ty = Math.random() * H;
            const th = 6 + Math.random() * 30;

            ctx.drawImage(
                src,
                0, ty, W, th,
                (Math.random() - .5) * 40,
                ty, W, th
            );
        }
    }

    requestAnimationFrame(animateDVD);
}

/* TV POSITIONING */

function xform(z) {
    const vw = innerWidth;
    const vh = innerHeight - NAV_HEIGHT;

    let s, tx, ty;

    if (z) {
        s = Math.max(vw / SW, vh / SH);

        tx = vw / 2 - (SX + SW / 2) * s;
        ty = NAV_HEIGHT + vh / 2 - (SY + SH / 2) * s;
    } else {
        s = Math.min(
            vw * .94 / TW,
            vh * .9 / TH,
            1.5
        );

        tx = (vw - TW * s) / 2;
        ty = NAV_HEIGHT + (vh - TH * s) / 2 - 14;
    }

    tv.style.transform =
        `translate(${tx}px, ${ty}px) scale(${s})`;
}

function layout() {
    if (!zoomed) {
        tv.classList.remove("anim");
    }

    xform(zoomed);
}

window.addEventListener("resize", layout);

/* LOAD DVD AND TRANSITION TO HOME */

async function load() {
    if (busy || zoomed) return;

    busy = true;

    disc.disabled = true;
    hint.style.opacity = 0;

    tray.classList.add("closed");

    await wait(1250);

    const T = 2400;
    const t0 = performance.now();

    tv.classList.add("anim");
    tv.classList.add("zoomed");

    xform(true);
    zoomed = true;

    await new Promise(done => {
        function step() {
            const t = performance.now() - t0;
            const p = Math.min(t / T, 1);

            bs = Math.max(
                1,
                Math.round(1 + p * p * 58)
            );

            noise = p * .9;

            if (p >= 1) {
                done();
            } else {
                requestAnimationFrame(step);
            }
        }

        requestAnimationFrame(step);
    });

    await wait(150);

    window.location.href = "Home.html";
}

disc.addEventListener("click", load);

layout();
animateDVD();

</script>
