<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcy let down your hair</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }
      body {
        margin: 0;
        padding-top: 60px;
        background-color: #fdfdfd;
        min-height: 100vh;
        overflow: hidden;
      }

      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: #d8bddb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 80px 0 20px;
        box-sizing: border-box;
        z-index: 1000;
      }

      .links a:hover {
        font-weight: bold;
      }

      .logo {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .logo img {
        width: 40px;
        height: auto;
        display: block;
      }

      .links {
        display: flex;
        align-items: center;
        margin-left: 20px;
        margin-right: auto;
      }

      .links a {
        color: #eae85d;
        text-decoration: none;
        margin-right: 20px;
        font-family: Arial, sans-serif;
        font-weight: 500;
        white-space: nowrap;
      }

      .lang-btn {
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 5px 12px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }

      /* CAMERA STAGING AREA */
      .stage-wrapper {
        width: 100vw;
        height: calc(100vh - 60px);
        display: flex;
        justify-content: flex-start;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .viewport {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 20px;
        width: auto;
        padding-left: 40px;
        transform-origin: 0 0;
        transition:
          transform 1.5s cubic-bezier(0.4, 0, 0.1, 1),
          opacity 0.4s ease 1.1s;
        will-change: transform, opacity;
      }

      .viewport.fade-out {
        opacity: 0;
      }

      .cd-start-area {
        width: 200px;
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-shrink: 0;
      }

      .cd-image {
        width: 140px;
        height: 140px;
        object-fit: contain;
        cursor: grab;
        position: absolute;
        touch-action: none;
        filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.6));
        z-index: 20;
      }

      .cd-image:active {
        cursor: grabbing;
      }

      .cd-image.hidden {
        display: none;
      }

      .computer-container {
        position: relative;
        width: 800px;
        flex-shrink: 0;
      }

      .computer-image {
        width: 100%;
        height: auto;
        display: block;
      }

      .drop-zone {
        position: absolute;
        top: 34%;
        left: 17%;
        width: 19%;
        height: 15%;
        border: 2px dashed rgba(21, 127, 49, 0.4);
        border-radius: 8px;
        transition:
          background 0.2s,
          border-color 0.2s;
      }

      .drop-zone.drag-over {
        background: rgba(44, 219, 47, 0.3);
        border-color: #6366f1;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <a class="logo" id="homeLogo" href="#">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>

      <div class="links">
        <a href="#" id="homeLink" data-en="Home" data-fr="Accueil">Home</a>
        <a href="2ndHome.html" data-en="scenes" data-fr="Robot">scenes</a>
        <a href="Robot.html" data-en="Robot" data-fr="Robot">Robot</a>
        <a href="Arcade.html" data-en="Arcade" data-fr="Arcade">Arcade</a>
        <a href="Timeline.html" data-en="Timeline" data-fr="Chronologie"
          >Timeline</a
        >
        <a href="Sponsors.html" data-en="Sponsors" data-fr="Commanditaires"
          >Sponsors</a
        >
        <a href="Team.html" data-en="Team" data-fr="Équipe">Team</a>
      </div>

      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>
    </div>

    <div class="stage-wrapper">
      <div class="viewport" id="viewport">
        <div class="cd-start-area">
          <img
            src="../images/cd.png"
            alt="repunzal cd"
            class="cd-image"
            id="cdImage"
            draggable="false"
          />
        </div>

        <div class="computer-container" id="computerContainer">
          <img
            src="../images/computer.gif"
            alt="computer"
            class="computer-image"
            id="computerImage"
          />
          <div class="drop-zone" id="dropZone"></div>
        </div>
      </div>
    </div>

    <script>
      let currentLang = "en";

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";
        document.documentElement.lang = currentLang;

        const elementsToTranslate = document.querySelectorAll("[data-en]");
        elementsToTranslate.forEach((element) => {
          element.innerText = element.getAttribute(`data-${currentLang}`);
        });
      }

      const cdImage = document.getElementById("cdImage");
      const computerImage = document.getElementById("computerImage");
      const dropZone = document.getElementById("dropZone");
      const viewport = document.getElementById("viewport");
      const computerContainer = document.getElementById("computerContainer");
      const homeLink = document.getElementById("homeLink");
      const homeLogo = document.getElementById("homeLogo");

      // File Paths (Adjust if computer_selection.png is inside your ../images/ directory)
      const INITIAL_COMPUTER_SRC = "../images/computer.gif";
      const RETRACT_GIF_SRC = "../images/computer.gif.gif";
      const FINAL_IMAGE_SRC = "../images/computer_selection.png";

      const GIF_DURATION = 4500;

      let isDragging = false;
      let isAnimating = false;
      let startX = 0,
        startY = 0;
      let currentX = 0,
        currentY = 0;

      cdImage.addEventListener("pointerdown", (e) => {
        if (isAnimating) return;
        isDragging = true;
        cdImage.setPointerCapture(e.pointerId);

        startX = e.clientX - currentX;
        startY = e.clientY - currentY;
      });

      cdImage.addEventListener("pointermove", (e) => {
        if (!isDragging) return;

        currentX = e.clientX - startX;
        currentY = e.clientY - startY;

        cdImage.style.transform = `translate(${currentX}px, ${currentY}px)`;

        const targetRect = dropZone.getBoundingClientRect();
        const cdRect = cdImage.getBoundingClientRect();

        const cdCenter = {
          x: cdRect.left + cdRect.width / 2,
          y: cdRect.top + cdRect.height / 2,
        };

        const isHovering =
          cdCenter.x >= targetRect.left &&
          cdCenter.x <= targetRect.right &&
          cdCenter.y >= targetRect.top &&
          cdCenter.y <= targetRect.bottom;

        if (isHovering) {
          dropZone.classList.add("drag-over");
        } else {
          dropZone.classList.remove("drag-over");
        }
      });

      cdImage.addEventListener("pointerup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        dropZone.classList.remove("drag-over");

        const targetRect = dropZone.getBoundingClientRect();
        const cdRect = cdImage.getBoundingClientRect();

        const cdCenter = {
          x: cdRect.left + cdRect.width / 2,
          y: cdRect.top + cdRect.height / 2,
        };

        const isInside =
          cdCenter.x >= targetRect.left &&
          cdCenter.x <= targetRect.right &&
          cdCenter.y >= targetRect.top &&
          cdCenter.y <= targetRect.bottom;

        if (isInside) {
          insertCD();
        } else {
          resetCDPosition();
        }
      });

      function insertCD() {
        isAnimating = true;
        cdImage.classList.add("hidden");
        dropZone.style.display = "none";

        // 1. Play drawer close animation GIF
        computerImage.src = `${RETRACT_GIF_SRC}?t=${Date.now()}`;

        // 2. Swap to final image when GIF finishes, then trigger zoom
        setTimeout(() => {
          computerImage.src = FINAL_IMAGE_SRC;

          requestAnimationFrame(() => {
            zoomToMonitor();
          });
        }, GIF_DURATION);
      }

      function zoomToMonitor() {
        // Measure real positions relative to viewport
        const viewportRect = viewport.getBoundingClientRect();
        const compRect = computerContainer.getBoundingClientRect();

        // Screen area percentages relative to computer container
        const screenLeft = compRect.left + compRect.width * 0.472;
        const screenTop = compRect.top + compRect.height * 0.088;
        const screenWidth = compRect.width * 0.395;
        const screenHeight = compRect.height * 0.485;

        // Center point of the computer screen in page coordinates
        const screenCenterX = screenLeft + screenWidth / 2 - viewportRect.left;
        const screenCenterY = screenTop + screenHeight / 2 - viewportRect.top;

        // Scale factors to make the CRT screen fill the user's viewport
        const navHeight = 60;
        const availWidth = window.innerWidth;
        const availHeight = window.innerHeight - navHeight;

        const scaleX = availWidth / screenWidth;
        const scaleY = availHeight / screenHeight;
        const scale = Math.max(scaleX, scaleY);

        // Target center point (center of browser area below nav bar)
        const targetCenterX = availWidth / 2;
        const targetCenterY = navHeight + availHeight / 2 - viewportRect.top;

        const translateX = targetCenterX - screenCenterX * scale;
        const translateY = targetCenterY - screenCenterY * scale;

        // Apply smooth 3D CSS transform dive into the monitor
        viewport.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;

        // Redirect directly to 2ndHome.html after zoom completes
        setTimeout(() => {
          window.location.href = "2ndHome.html";
        }, 1200);
      }

      function resetCDPosition() {
        currentX = 0;
        currentY = 0;
        cdImage.style.transform = `translate(0px, 0px)`;
      }

      function resetToInitial() {
        viewport.classList.remove("fade-out");
        viewport.style.transform = "none";

        computerImage.src = INITIAL_COMPUTER_SRC;
        dropZone.style.display = "block";
        resetCDPosition();
        cdImage.classList.remove("hidden");

        isAnimating = false;
      }

      homeLink.addEventListener("click", (e) => {
        e.preventDefault();
        resetToInitial();
      });

      homeLogo.addEventListener("click", (e) => {
        e.preventDefault();
        resetToInitial();
      });
    </script>
  </body>
</html>
