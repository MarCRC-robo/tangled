<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Sponsors</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding-top: 60px;
        background-color: #fdfdfd;
        min-height: 100vh;
      }

      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 3px solid #552586;
        background: linear-gradient(
          180deg,
          #b589d6 0%,
          #9969c7 35%,
          #975ed3 50%,
          #6a359c 80%,
          #552586 100%
        );
      }

      .logo {
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      .logo img {
        width: 36px;
        height: auto;
        display: block;
      }

      .desktop-links {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 100%;
        flex: 1;
        margin: 0 12px;
      }

      .button {
        flex: 1;
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 8px;
        color: #ffffff;
        text-decoration: none;
        font-family: "Trebuchet MS", Arial, sans-serif;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(80, 0, 50, 0.6);
        border: 1px solid #552586;
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        background: linear-gradient(
          180deg,
          #6c3299 0%,
          #9969c7 35%,
          #6726ad 50%,
          #3a076a 80%,
          #552586 100%
        );
        transition: filter 0.15s ease;
      }

      .button:hover {
        filter: brightness(1.15);
      }

      .button[aria-current="page"] {
        height: 44px;
        margin-bottom: -3px;
        background: linear-gradient(
          180deg,
          #b773ff 0%,
          #913bed 20%,
          #7d2fd1 50%,
          #6726ad 72%,
          #551c92 90%,
          #350d60 100%
        );
      }

      .dropdown {
        position: relative;
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: flex-end;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 120px;
        background: linear-gradient(180deg, #6a359c 0%, #552586 100%);
        border: 1px solid #552586;
        border-top: none;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        z-index: 1100;
      }

      .dropdown-content a {
        display: block;
        padding: 14px 20px;
        color: #ffffff;
        text-decoration: none;
        font-family: "Trebuchet MS", Arial, sans-serif;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        white-space: nowrap;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .dropdown-content a:hover {
        background-color: #3a076a;
        color: #eae85d;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }

      .nav-controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .lang-btn {
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 4px 10px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }

      .options {
        display: none;
        background: transparent;
        border: none;
        cursor: pointer;
        flex-direction: column;
        justify-content: space-between;
        width: 26px;
        height: 18px;
        padding: 0;
      }

      .options span {
        display: block;
        width: 100%;
        height: 3px;
        background-color: #ffffff;
        border-radius: 3px;
      }

      .mobile-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2000;
        background: linear-gradient(
          180deg,
          #6a359c 0%,
          #552586 40%,
          #350d60 100%
        );
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
        overflow-y: auto;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .mobile-overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .close-btn {
        align-self: flex-start;
        background: none;
        border: none;
        color: #ffffff;
        font-size: 32px;
        cursor: pointer;
        line-height: 1;
        padding: 0;
        margin-bottom: 50px;
      }

      .mobile-links-list {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .mobile-link {
        color: #ffffff;
        text-decoration: none;
        font-family: "Trebuchet MS", Arial, sans-serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.5px;
        transition: color 0.2s ease, transform 0.2s ease;
      }

      .mobile-link:hover,
      .mobile-link[aria-current="page"] {
        color: #eae85d;
        font-weight: bold;
      }

      .mobile-sublinks {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin: -10px 0 0 20px;
        padding-left: 14px;
        border-left: 2px solid #eae85d;
      }

      .mobile-sublinks .mobile-link {
        font-size: 17px;
      }

      @media (max-width: 768px) {
        .desktop-links {
          display: none;
        }

        .options {
          display: flex;
        }
      }
    </style>

    <style>
      /* 1. Page Background & Reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        padding-top: 60px;
        background-image: url('../images/cred.png');
        background-size: 115%;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #ffffff;
        display: flex;
        justify-content: center;
        overflow-x: hidden;
      }

      /* 2. Side Containers for Cubes */
      .cube-track {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 80px;
        overflow: hidden;
        z-index: 10;
        pointer-events: none;
        contain: paint;
      }

      .cube-track.left {
        left: 20px;
      }

      .cube-track.right {
        right: 20px;
      }

      /* Continuous upward animation loop */
      .cube-column {
        display: flex;
        flex-direction: column;
        gap: 35px;
        animation: loopUp 12s linear infinite;
        will-change: transform;
      }

      @keyframes loopUp {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-50%);
        }
      }

      /* 3. Cube Visual Styling */
      .cube {
        width: 25px;
        height: 25px;
        margin: 0 auto;
        background-color: #000000c3;
        border-radius: 2px;
        flex-shrink: 0;
      }

      /* 4. Center Credits Text Container */
      .credits-container {
        width: 100%;
        max-width: 850px;
        padding: 0px 0px;
        text-align: center;
        z-index: 5;
      }

      .title {
        font-family: 'Cinzel', serif;
        font-size: 3rem;
        letter-spacing: 5px;
        color: #b88635;
        margin-bottom: 20px;
      }

      .role {
        font-family: 'Cinzel', serif;
        font-size: 1.5rem;
        font-style: italic;
        color: #b88635;
        letter-spacing: 3px;
        margin-bottom: 25px;
      }

      .names {
        font-family: "Times New Roman", serif;
        font-size: 1.15rem;
        font-weight: 400;
        letter-spacing: 1.5px;
        line-height: 1.8;
        color: #655533;
        margin-bottom: 8px;
        transition: 0.3s;
      }

      .sponsors-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 600px;
        margin: 0 auto;
        padding: 10px;
      }

      .sponsors-list .names {
        width: 100%;
        padding: 8px 0;
        border-bottom: 1px solid rgba(184, 134, 53, 0.3);
      }

      .sponsors-list .names:last-child {
        border-bottom: none;
      }

      .sponsors-container {
        display: flex;
        justify-content: center;
        width: 100%;
        margin: 20px auto;
      }

      .sponsors-image {
        width: 100%;
        max-width: 650px;
        height: auto;
        display: block;
        mix-blend-mode: multiply;
      }
    </style>

    <script>
      let currentLang = "en";

      function openMenu() {
        document.getElementById("mobileOverlay").classList.add("active");
      }

      function closeMenu() {
        document.getElementById("mobileOverlay").classList.remove("active");
      }

      function toggleLanguage() {
        currentLang = currentLang === "en" ? "fr" : "en";
        document.getElementById("langBtn").innerText =
          currentLang === "en" ? "FR" : "EN";
        document.documentElement.lang = currentLang;

        document.querySelectorAll("[data-en]").forEach((el) => {
          el.innerText = el.getAttribute(`data-${currentLang}`);
        });
      }

      const currentPage = location.pathname.split("/").pop() || "index.html";
      document.querySelectorAll(".button, .mobile-link").forEach((link) => {
        if (link.getAttribute("href") === currentPage) {
          link.setAttribute("aria-current", "page");
        }
      });
    </script>
