<!doctype html>
<html lang="en">
  <head>
   <h1> WANTED </h1>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }

.body{
   margin: 0;
        padding-top: 60px;
        background-image: url(../images/wood\ image.jpg);
        min-height: 100vh;
        background-position: center;
        background-attachment: fixed;
        background-size: cover;
        background-repeat: no-repeat;


}
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        z-index: 1000;
        display: flex;
        align-items: flex-end;
        gap: 6px; /* Reduced gap between buttons */
        padding: 0 10px;
        overflow-x: auto;
        scrollbar-width: none;
        border-bottom: 3px solid #552586;
        background: linear-gradient(
          180deg,
          #b589d6 0%,
          #9969c7 35%,
          #975ed3 50%,
          #6a359c 80%,
          #552586 100%
        );
      }

      .bar::-webkit-scrollbar {
        display: none;
      }

      .logo {
        align-self: center;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        margin-right: 4px;
        cursor: pointer;
      }

      .logo img {
        width: 36px;
        height: auto;
        display: block;
      }

      .button {
        flex: 1; /* Allows buttons to share navbar space evenly */
        min-width: 0; /* Prevents button overflow */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 8px; /* Reduced padding inside buttons */
        color: #ffffff;
        text-decoration: none;
        font-family: "Trebuchet MS", Arial, sans-serif;
        font-size: 11px; /* Smaller font size to accommodate longer French text */
        font-weight: 900;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(80, 0, 50, 0.6);
        border: 1px solid #552586;
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        background: linear-gradient(
          180deg,
          #6c3299 0%,
          #9969c7 35%,
          #6726ad 50%,
          #3a076a 80%,
          #552586 100%
        );
        transition: filter 0.15s ease;
      }

      .button:hover {
        filter: brightness(1.15);
      }

      .button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -4px;
      }

      .button[aria-current="page"] {
        height: 44px;
        margin-bottom: -3px;
        background: linear-gradient(
          180deg,
          #b773ff 0%,
          #913bed 20%,
          #7d2fd1 50%,
          #6726ad 72%,
          #551c92 90%,
          #350d60 100%
        );
      }

      .lang-btn {
        flex-shrink: 0;
        align-self: center;
        margin-left: 4px;
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 4px 10px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }
 .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background-color: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    justify-content: center;
    align-items: center;
}

/* The actual pop-up window */
.modal-content {
    background-color: white;
    width: 60%;
    height: 70%;
    position: relative;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 30px black;
}

/* The X button */
.close {
    position: absolute;
    top: 10px;
    right: 18px;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    color: black;
}

.close:hover {
    color: red;
}
.popup-image {
    width: 300px;
    height: 280px;
    object-fit: cover;
    margin-top: 15px;
    display: block;
}
.hover-image {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
}

.hover-image:hover {
    transform: scale(1.10);
    box-shadow: 10px 10px 200px rgb(163, 164, 164);
}

/* Positions the three posters */
.posters {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    width: 100%;
}
.Monica img{

    width: 350px;
    height: 500px;
    transform: transform 0.3s ease, box-shadow: 0.3s ease;
}

.Mia img{

    width: 350px;
    height: 500px;
    transform: transform 0.3s ease, box-shadow: 0.3s ease;

}
.Jess img {

    width: 350px;
    height: 500px;
    transform: transform 0.3s ease, box-shadow: 0.3s ease;

}
    </style>
  </head>
  <body>
    <nav class="bar">
      <a class="logo" id="homeLogo" href="index.html">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>
      <a href="index.html" class="button" data-en="TV" data-fr="TV">TV</a>
      <a href="Home.html" class="button" data-en="Home" data-fr="Accueil">Home</a>
      <a href="Cast.html" class="button" data-en="Cast" data-fr="Casting">Cast</a>
      <a href="Settings.html" class="button" data-en="Settings" data-fr="Paramètres">Settings</a>
      <a href="Blog.html" class="button" data-en="Blog" data-fr="Blog">Blog</a>
      <a href="Arcade.html" class="button" data-en="Arcade" data-fr="Arcade">Arcade</a>
      <a href="Credits.html" class="button" data-en="Credits" data-fr="Crédits">Credits</a>
      <a href="Trailer.html" class="button" data-en="Trailer" data-fr="Bande-annonce">Trailer</a>

      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>
    </nav>
<div class="posters">

    <div class="Monica">
    <img src="../images/Monica.jpg" class="hover-image" onclick="openModal('monicaModal')">
    </div>
    <div class="Mia">
    <img src="../images/Mia.jpg" class="hover-image" onclick="openModal('miaModal')">
    </div>
    <div class="Jess">
    <img src="../images/Jess.jpg" class="hover-image" onclick="openModal('jessModal')">
    </div>

<!-- Monica's pop-up -->
<div id="monicaModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('monicaModal')">&times;</span>
        <h1>MONICA</h1>
        <img src="../images/Monica.jpg" class="popup-image">
        <p>Information about Monica goes here.</p>
    </div>
</div>

<!-- Mia's pop-up -->
<div id="miaModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('miaModal')">&times;</span>
        <h1>MIA</h1>
        <img src="../images/Mia.jpg" class="popup-image">
        <p>Information about Mia goes here.</p>
    </div>
</div>

<!-- Jess's pop-up -->
<div id="jessModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('jessModal')">&times;</span>
        <h1>JESS</h1>
        <img src="../images/Jess.jpg" class="popup-image">
        <p>Information about Jess goes here.</p>
    </div>
</div>

    <script>
   function openModal(id) {
    document.getElementById(id).style.display = "flex";
}

function closeModal(id) {
    document.getElementById(id).style.display = "none";
}
    </script>
  </body>
</html>
