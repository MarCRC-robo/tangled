<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcy let down your hair</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding-top: 60px;
        background-image: url(../images/scene_selection\ \(2\).jpg);
        min-height: 100vh;
      }

      .bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: #d8bddb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 80px 0 20px;
        box-sizing: border-box;
        z-index: 1000;
        transform-origin: left center;
        transition:
          transform 0.6s ease-in-out,
          opacity 0.6s ease-in-out;
      }

      .links a:hover {
        font-weight: bold;
      }

      .logo {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .logo img {
        width: 40px;
        height: auto;
        display: block;
      }

      .links {
        display: flex;
        align-items: center;
        margin-left: 20px;
        margin-right: auto;
      }

      .links a {
        color: #eae85d;
        text-decoration: none;
        margin-right: 20px;
        font-family: Arial, sans-serif;
        font-weight: 500;
        white-space: nowrap;
      }

      .lang-btn {
        background-color: transparent;
        color: #eae85d;
        border: 2px solid #eae85d;
        border-radius: 5px;
        padding: 5px 12px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background-color: #eae85d;
        color: #1a0f23;
      }

      .page-btn {
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        outline: none;
        transition:
          transform 0.2s ease,
          filter 0.2s ease;
      }

      .page-btn img {
        width: 350px;
        height: auto;
        position: fixed;
        /* Fixed so it remains clickable outside the bar flow */
        top: 140px;
        left: 410px;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="bar">
      <a class="logo" href="Home.html">
        <img src="../images/logo sun.png" alt="sun logo" />
      </a>
      <div class="links">
        <a href="index.html" data-en="Home" data-fr="Accueil">Home</a>
        <a href="2ndHome.html" data-en="Scenes" data-fr="Scenes">Scenes</a>

        <a href="Robot.html" data-en="Robot" data-fr="Robot">Robot</a>
        <a href="Arcade.html" data-en="Arcade" data-fr="Arcade">Arcade</a>
        <a href="Timeline.html" data-en="Timeline" data-fr="Chronologie"
          >Timeline</a
        >
        <a href="Sponsors.html" data-en="Sponsors" data-fr="Commanditaires"
          >Sponsors</a
        >
        <a href="Team.html" data-en="Team" data-fr="Équipe">Team</a>
      </div>

      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">
        FR
      </button>

      <a href="Robot.html" class="page-btn">
        Home <img src="../images/click.png" alt="Go to page icon" />
      </a>
    </div>
  </body>
</html>
